	<script>

		//Iterate desktop icon from:
		//	http://clipart-library.com/purple-spider-cliparts.html


		//	Description of Iterate Functionality/Behavior:
		//
		//	GET parameters:
		//		<forceSavingModifiedGroups> = Do not provide user with option in command sequence to use the temporary group for modified groups
		//		<forceUseOfAliases> = Do not provide user with option in command sequence to use an arbitrary group
		//		<forceGroupsOnly> = Do not provide user with option in command sequence to use Macros
		//
		//
		//	- Requires user to have LOCK
		//
		//	- Top Pane:
		//		* Refresh
		//		* Iteration Plan: <name> and  > || |_|  controls and "Status: Inactive"
		//		* when modified, do not show > || |_| controls..
		//			instead show Save and Discard Changes buttons
		//
		//	- Bottom Pane:
		//		* Similar functionality to GUI subset.. in that it edits the
		//			the currently active Iteration group. (If a user wants to change the active
		//			Iteration group, they must do so in the Config GUI)
		//
		//		* Very top of "tree-view" choose the Iteration Plan name
		//			* Then default to simple plan, e.g.:
		//				- BEGIN_LABEL 0 (hide index from user - show by indent)
		//				- Configure Configuration Group/System Alias
		//				- REPEAT_LABEL 0 ( 0 times - when 0 show as END LOOP)
		//				- In GUI, show END (no representation in table)
		//
		//		* Create Rows in table that match sequence
		//
		//		* Row Types
		//			- BEGIN_LABEL <label>
		//			- REPEAT_LABEL <label> <number of times to repeat 0-to-N>
		//				#note: must have a matching BEGIN_LABEL
		//			- CHOOSE_STATE_MACHINE <fsm name> #by default ""
		//			- CONFIGURE_ALIAS <alias name>
		//			- CONFIGURE_GROUP <group name> <group key>
		//			- MODIFY_ACTIVE_GROUP <bool:do save new group #else use temporary group>
		//				<relative path from FE> <start value> <iteration step size>
		//				<target Group #which can span multiple FE-Managers or whatever>
		//				#note: always must (so that macro things work) have a CONFIGURE_ACTIVE_GROUP after a MODIFY_ACTIVE_GROUP
		//				#	but can group modifies together and do one CONFIGURE_ACTIVE_GROUP.
		//			- CONFIGURE_ACTIVE_GROUP
		//			- EXECUTE_MM_MACRO <macro name> <target Group #which can span multiple FE-Managers or whatever>
		//				<parameter group of name, value, iteration step size to adjust in macro>
		//				#note: must be a public macro
		//			- EXECUTE_FE_MACRO <FE macro name> <target Group #which can span multiple FE-Managers or whatever>
		//				<parameter group of name, value, iteration step size to adjust in inputs to FE macro>
		//			- RUN	<dump type> <bool: wait for all FEs to complete running thread else use time>
		//				<seconds for run>
		//			- START - execute transition
		//			- STOP - execute transition
		//			- PAUSE - execute transition
		//			- RESUME - execute transition
		//			- HALT - execute transition
		//
		//
		//	- Save functionality should be same as saving tree
		//		* If admin, could give options to target a certain system alias.. Etc.
		//		* Else assume saving to currently active groups
		//
		//
		//	- Interactions with Server
		//		* App must have access to Configuration GUI Supervisor, Gateway Supervisor,
		//				MacroMaker Supervisor (Macro Maker can run FE Macros)
		//			-- this means primary urn to GUI Supervisor, secondary to Gateway Supervisor,
		//				and special handshaking (from Gateway Supervisor) with MacroMaker Supervisors
		//
		//		* Requests:
		//				= from Configuration GUI Supervisor =
		//			-- Get Iteration Plan Names
		//			-- Load Iteration Plan
		//			-- Save Iteration Plan
		//
		//				= from Gateway Supervisor =
		//			-- Play/Resume Iteration Plan (implications for MacroMaker, coordinated by Gateway)
		//			-- Pause Iteration Plan
		//			-- Stop/Reset Iteration Plan
		//			-- Get Active Iteration Plan Status (status could be: inactive, running, paused)

		//	Gateway Server Iterator
		//		- Iterator to manage iterating -- separate thread
		//		- Commands:
		//			- stateMachineXgiHandler/PlayIterationPlan:
		//				- if not running, launches thread (if all state machines are halted)
		//					and starts playing iteration plan.
		//			- stateMachineXgiHandler/PauseIterationPlan:
		//				- if running, pauses iteration plan.
		//			- stateMachineXgiHandler/HaltIterationPlan:
		//				- if running, halts/resets iteration plan. Lose progress. Halts FSM.
		//			- stateMachineXgiHandler/getIterationPlanStatus:
		//				- returns status (status could be: inactive, running, paused)
		//					and FSM state and isTransitioning,
		//					and which iteration plan command.
		//

		//=====================================================================================
		//paint ~~
		//	positiong left and right panes based on window size
		function paint()
		{
			var w = DesktopContent.getWindowWidth();
			var h = DesktopContent.getWindowHeight();
			//Debug.log("paint w,h=" + w + "," +h);

			var MIN_H = 280;
			var MIN_W = 580;
			if(w < MIN_W)
				w = MIN_W;
			if(h < MIN_H)
				h = MIN_H;

			Debug.log("paint w,h=" + w + "," +h);

			var TOP_H = 85;//56;
			var BORDER_SZ = 0;
			var MARGIN = 5;

			if(!_bottomPane && !_topPane)
			{
				//first time create elements
				createTopPaneContent();
				createBottomPaneContent();

				updateIterationPlanContent();
			}


			var y = MARGIN;
			var x = MARGIN;
			w -= 2*MARGIN;
			h -= 2*MARGIN;

			_topPane.style.left = x + "px";
			_topPane.style.top = y + "px";
			_topPane.style.width = (w - 2*BORDER_SZ) + "px";
			_topPane.style.height = (TOP_H - 2*BORDER_SZ) + "px";

			y += TOP_H + MARGIN;
			h -= TOP_H + MARGIN;

			//set bottom pane sizes
			h -= 2*BORDER_SZ + MARGIN;

			_bottomPane.style.left = x + "px";
			_bottomPane.style.top = y + "px";
			_bottomPane.style.width = w + "px";
			_bottomPane.style.height = h + "px";

		}	//end paint()

			str = "";

			str += "<div id='planSelectDiv'>";

			{
				str += "No plans found. Create one here ==> ";
			}
			else
			{
				str += "<select id='planSelect' onchange='handlePlanSelect();'>";
				for(var i=0;i<_planUIDs.length;++i)
				{
					str += "<option value='" + i + "'>";

		//=====================================================================================
		//drawIterationPlan ~~
		//  if plan then request commands from server, otherwise use current _targetPlan and
		//      existing _commands.
		function drawIterationPlan(plan)
		{
			if(plan !== undefined)
			{
				_targetPlan = plan;

				if(!_DEBUG_WOUT_SERVER)
					ConfigurationAPI.getTree(_ITERATE_BASE_PATH + "/" + plan,
										 8, //down through macro loop parameter rows
										 _modifiedTables,
										 localExtractTree
										 );
			}
			else
				plan = _targetPlan;

			Debug.log("drawIterationPlan " + plan);

			//load plan and display detail
			//	get command sequence

			if(_DEBUG_WOUT_SERVER)
			{
				//bypass server request and fake data
				var children = document.createElement("div");
				var commands = [];
				commands.push({ 	//BEGIN_LABEL
				"type" : _COMMAND_TYPES.BEGIN_LABEL,
				"param" : {"Label":"Main"},
				});
				commands.push({ 	//CHOOSE_FSM
				"type" : _COMMAND_TYPES.CHOOSE_FSM,
				"param" : {"NameOfStateMachine":(_fsmNames.length? //use first name, if any exist
						_fsmNames[0]
						:"")},
				});
				commands.push({		//CONFIGURE_ALIAS aliasMap[0]
				"type" : _COMMAND_TYPES.CONFIGURE_ALIAS,
				"param" : {"SystemAlias":(_tableGroupAliases.length? //use first alias, if any exist
						_tableGroupAliases[0].alias
						:""),
						"SkipIfAlreadyConfigured":0},
				});
				commands.push({		//RUN 5 minutes
				"type" : _COMMAND_TYPES.RUN,
				"param" : {"WaitForAllFrontEndsRunningThread":0,
					"DurationInSeconds": 5*60},
				});
				commands.push({		//WAIT 1 minutes
				"type" : _COMMAND_TYPES.WAIT,
				"param" : {"WaitForAllFrontEndsRunningThread":0,
					"DurationInSeconds": 60},
				});
				commands.push({ 	//REPEAT_LABEL
				"type" : _COMMAND_TYPES.REPEAT_LABEL,
				"param" : {"Label":"Main", "NumberOfRepetitions":0},
				});

				_commands = commands;

				localDrawIterationPlan();
				return;
			}
			else
				localDrawIterationPlan();



			//::::::::::::::::::::::::::::::::::::
			//localExtractTree ~
			//	extract tree into the _commands object
			function localExtractTree(tree)
			{
				if(!tree && !_DEBUG_WOUT_SERVER)
				{
					Debug.log("Invalid tree xml object.");
					return;
				}

				_commands = []; //clear

				//try for any errors in format
				try
				{
					var nodes = tree.children;
					var nodeChildren;
					var commandChildren;
					var commandFieldsChildren;
					var parameterChildren;
					var parameterName;
					var targetCSVStr, targetCount;
					var targetChildren;
					var countCommands = 0;

					var type,params,type_targetSubsystem,type_legacyLoopNote; //to make command

					//for each plan field
					//	find link to command group
					//		for each command
					//			fill command type
					//			find link to parameters
					//				fill parameters
					for(var i=0;i<nodes.length;++i)
					{
						nodeChildren = nodes[i].children;

						if(nodeChildren[0].nodeName != "value")    //asssume this is group link to commands
						{
							for(var j=0;j<nodeChildren.length;++j)
							{
								if(nodeChildren[j].nodeName == "node")
								{
									//found child node -- command UID level
									commandChildren = nodeChildren[j].children;

									for(var k=0;k<commandChildren.length;++k)
									{
										if(commandChildren[k].nodeName == "node")
										{
											//found child node -- command field
											if(commandChildren[k].getAttribute("value") == "CommandType")
											{
												type = commandChildren[k].children[0].getAttribute("value");
												params = [];
											}
											else if(commandChildren[k].getAttribute("value") == "TargetSubsystem")
											{
												type_targetSubsystem = commandChildren[k].children[0].getAttribute("value");
												//an unset table column reads back as the "DEFAULT" sentinel = Self
												if(type_targetSubsystem == "DEFAULT" || type_targetSubsystem == "Default")
													type_targetSubsystem = "";
											}
											else if(commandChildren[k].getAttribute("value") == "LinkToCommandTable")
											{
												parameterChildren = commandChildren[k].children;

												for(var l=0;l<parameterChildren.length;++l)
												{
													if(parameterChildren[l].nodeName == "node")
													{
														//found child node -- parameter field
														// take as parameter until the comment field is reached

														parameterName = parameterChildren[l].getAttribute("value");
														if(parameterName == "CommentDescription")
															break;

														Debug.log("parameter name = " + parameterName);

														if(parameterName == "LinkToTargets")
														{
															//extract targets
															Debug.log("getting targets");
															targetCSVStr = "";

															targetChildren = parameterChildren[l].children;
															targetCount = 0;

															for(var m=0;m<targetChildren.length;++m)
															{
																if(targetChildren[m].nodeName == "node")
																{
																	if(targetCount++) targetCSVStr += ",";

																	var targetChildrenChildren = targetChildren[m].getElementsByTagName("node");

																	//found target record
																	//	second record is link
																	//		first two nodes are uid and table
																	targetCSVStr +=
																			targetChildrenChildren[1].getElementsByTagName(
																					"LinkTableName")[0].getAttribute("value") +
																					"/" +
																			targetChildrenChildren[1].getElementsByTagName(
																					"UID")[0].getAttribute("value");
																}
															} //end target loop

															params.push(targetCSVStr);
														}
														else if(parameterName == _COMMAND_PARAM_FIELDS.LinkToMacroDimensions )
														{
															//for execute FEMacro and Macro commands:
															//	walk loop rows -> parameter rows into the MacroArgs wire string
															var loopResult = macroArgsFromLoopTree(parameterChildren[l]);
															params.push(loopResult.macroArgs);
															if(loopResult.legacy)
																type_legacyLoopNote = loopResult.legacy;
														}
														else
															params.push(parameterChildren[l].children[0].getAttribute("value"));

														Debug.log("parameter value = " + params[params.length-1]);
													}
												} //end parameter loop
											}
										}

									}

									//at this point, have command type and params
									console.log(type);
									console.log(params);
									addCommand(type,params);
									if(type_targetSubsystem)
										_commands[_commands.length-1].targetSubsystem = type_targetSubsystem;
									type_targetSubsystem = "";
									if(type_legacyLoopNote)
										_commands[_commands.length-1].legacyLoopNote = type_legacyLoopNote;
									type_legacyLoopNote = "";
								}
							}

							Debug.log("countCommands = " + _commands.length);
						}
					}
				} //end try
				catch(e)
				{
					Debug.err("Invalid or corrupt iteration plan '" + plan +
						"' loaded (please notify admins): " + e);
					_commands = []; //clear
				}

				_planIsModified = false; //because just loaded
				localDrawIterationPlan();

			} // end localExtractTree()

			//::::::::::::::::::::::::::::::::::::
			//draw based on _commands
			function localDrawIterationPlan()
			{
				if(!_commands)
				{
					Debug.log("Invalid commands object.");

				}

					{

								0 /*title*/,
								0 /*mousedown*/,
								0 /*drag*/,
								"handlePlanNameDragOver(" + i + ",event)" /*dragover*/,
								0 /*dragend*/

						str += "<b>" + (i+1) + ". PLAN_END." + //show period if 0 params

						str += "</div>";

						//up overlay
						str += htmlOpenDiv(
								"plan-command-upOverlay-" + i,
								"plan-command-overlay plan-command-upOverlay",

								0 /*mouseup*/,

						str += "</div>";

						//add command control
						str += htmlOpenDiv( //start add end command -----------
								"plan-command-addCommand-" + i,

							str += htmlOpenDiv(

									"plan-command-addCommand-button",

									"showCommandDialog(" + i + ")" /*mouseup*/,

							str += "+";
							str += "</div>";
						} str += "</div>"; //end add end command -----------

						str += "</div>"; //close end command -----------
					} //end last command span


					//end any open depth bars
					while(depthLabelStack.length)

						str += "</div>";  //end depth span -----------
						depthLabelStack.pop();
					}


				} str += "</div>";  //end depth 0 span -----------


				if(_planIsModified)

					str += DesktopContent.htmlClearDiv();

		//htmlOpenDiv ~~
		function htmlOpenDiv(idStr,classStr,styleStr,mouseupStr,mousemoveStr,
				titleStr,mousedownStr,dragStr,dragoverStr,dragendStr)
		{
			return "<div " +
					(idStr?("id='" + idStr + "' "):"") +
					(classStr?(" class='" + classStr + "' "):"") +
					(styleStr?(" style='" + styleStr + "' "):"") +
					(mouseupStr?(" onmouseup='" + mouseupStr + "' "):"") +
					(mousemoveStr?(" onmousemove='" + mousemoveStr + "' "):"") +
					(titleStr?(" title='" + titleStr + "' "):"") +
					(mousedownStr?(" onmousedown='" + mousedownStr + "' "):"") +
					(dragStr?(" draggable='true' ondragstart='" + dragStr + "' "):"") +
					(dragoverStr?(" ondragover='" + dragoverStr + "' "):"") +
					(dragendStr?(" ondragend='" + dragendStr + "' "):"") +
					">";
		} //end htmlOpenDiv

		//=====================================================================================
		//handlePlanNameDragOver ~~
		function handlePlanNameDragOver(dragIndex,event)
		{
			//Debug.log("dragover " + dragIndex);

			if(_shownDragOverCommandIndex == dragIndex )
							return;

			//if not current, then hide current and show new

			try //try to hide, and ignore errors
			{
				if(_shownDragOverCommandIndex != -1)
				{
					document.getElementById("plan-command-name-" +
							_shownDragOverCommandIndex).style.backgroundColor = "transparent";
				}
			}
			catch(e){} //ignore

			//do not set to drag over if this is the one being dragged
			if(dragIndex == _shownDeleteCommandIndex)
				return;

			_shownDragOverCommandIndex = dragIndex;
			if(_shownDragOverCommandIndex != -1)
			{
				document.getElementById("plan-command-name-" +
						_shownDragOverCommandIndex).style.backgroundColor =
								"rgb(251, 172, 53)";
			}

		}	//end handlePlanNameDragOver()

		//=====================================================================================
		//handlePlanNameDragEnd ~~
		function handlePlanNameDragEnd(dragIndex,event)
		{
			Debug.log("dragend " + dragIndex + " to " + _shownDragOverCommandIndex);

			dragIndex = dragIndex|0; //force int
			_shownDragOverCommandIndex = _shownDragOverCommandIndex|0; //force int


			//move dragIndex to _shownDragOverCommandIndex position

			//validate indices
			if(dragIndex < 0 || dragIndex >=  _commands.length ||
					dragIndex == _shownDragOverCommandIndex)
			{
				Debug.log("Invalid dragIndex -- how? " +
						dragIndex + " v " + _shownDragOverCommandIndex);
				return;
			}
			if(_shownDragOverCommandIndex < 0 ||
					_shownDragOverCommandIndex >  _commands.length)
			{
				Debug.log("Invalid _shownDragOverCommandIndex -- how? " +
						_shownDragOverCommandIndex);
				return;
			}

			//remove and insert
			var movingCommand = _commands.splice(dragIndex, 1); //returns array of elements removed (array size will be 1)
			if(dragIndex+1 < _shownDragOverCommandIndex) //now with removed, drop by 1
				--_shownDragOverCommandIndex; //+1 because behavior of swapping nearest neighbor is 'expected'
			_commands.splice(_shownDragOverCommandIndex, 0, movingCommand[0]); //insert element 0 of array
			_planIsModified = true;
			drawIterationPlan();

		}	//end handlePlanNameDragEnd()

		//=====================================================================================
		//handlePlanOverlayMouseMove ~~
		function handlePlanParamsMouseMove(i,event)
		{
			//Debug.log("handlePlanParamsMouseMove " + i);

			if(event) event.stopPropagation();

			if(event) handlePlanNameMouseMove(i); //highlight plan name

			if(event) handlePlanOverlayMouseMove(-1); //clear add command button

			//show parameters in easy to read fashion

			//remove all previous param displays
			var el;
			do
			{
				el = document.getElementById("plan-command-parameterDisplay");
				if(el) el.parentNode.removeChild(el);
			} while(el);

			if(i == -1) return;


			if(document.getElementById("DesktopContent-verifyPopUp"))
				return; //do not show if there is a popup

			//Debug.log("handlePlanParamsMouseMove " + i);

			//get command parameter keys
			var paramKeys = Object.keys(_commands[i].param);

			el = document.createElement("div");
			el.setAttribute("id","plan-command-parameterDisplay");
			var str = "";

			//command 'name'
			str += htmlOpenDiv(0,0,
					"float:left;" /*style*/);
			str += "<b>" + (i+1) + ". " + _commands[i].type +
					"</b>";
			str += "</div>";

			//edit icon
			str += htmlOpenDiv(0,
					"ConfigurationAPI-popUpDialog-editIcon" /*class*/,
					"display:block;" /*style*/,
					"showCommandDialog(" + i + ", true /*modifyExisting*/);" /*mouseup*/);
			str += "</div>";

			str += DesktopContent.htmlClearDiv();


			//str += "<br>";
			//str += "Time Created: ";
			str += "<br>";
			str += "Parameter Count: " + paramKeys.length;
			str += "<br>";
			str += "<br>";
			str += "<table>";

			for(var j=0;j<paramKeys.length;++j)
			{
				str += "<tr>";
				str += "<td>";
				str += "<b>" + paramKeys[j] + ":</b> ";
				str += "</td>";
				str += "<td style='padding-right:10px'>"; 	//for nice spacing after scroll right
				str += (paramKeys[j] == _COMMAND_PARAM_FIELDS.MacroArgs ?
						macroArgsSummary(_commands[i].param[paramKeys[j]]) :
						_commands[i].param[paramKeys[j]]);
				str += "</td>";
				str += "</tr>";
			}
			{	//how often this command executes per play of the plan
				var rc = getCommandRunCount(i);
				var runsText;
				if(_commands[i].type == _COMMAND_TYPES.BEGIN_LABEL)
					runsText = rc.passes == 0 ? "no matching REPEAT_LABEL" :
						"entered " + rc.runs + " time" + (rc.runs == 1 ? "" : "s") + ", " +
						rc.passes + " pass" + (rc.passes == 1 ? "" : "es") + " each = body runs " +
						(rc.runs * rc.passes) + " time" + (rc.runs * rc.passes == 1 ? "" : "s");
				else
					runsText = rc.runs + " time" + (rc.runs == 1 ? "" : "s") + " per play";
				if(rc.loops.length)
				{
					runsText += " (inside ";
					for(var l=0;l<rc.loops.length;++l)
						runsText += (l ? ", " : "") + rc.loops[l].label + ": " + rc.loops[l].passes + " passes";
					runsText += ")";
				}
				str += "<tr><td><b>Runs:</b> </td><td style='padding-right:10px'>" + runsText + "</td></tr>";
			}
			str += "</table>";

			if(_activeStatusHtml && _old_command_index == i)
			{
				str += "<hr style='border-color:rgb(160,102,102); margin:4px 0;'>";
				str += _activeStatusHtml;
			}

			el.innerHTML = str;

			//get x, y from offset parents
			var parentEl = document.getElementById("plan-command-params-" + i);

			var top = 0;
			var left = 0;
			var offsetParent; //save last valid offsetParent

			//accumulate parents
			while(parentEl)
				{top += parentEl.offsetTop; left += parentEl.offsetLeft;
				offsetParent = parentEl; //save last valid offsetParent
				parentEl = parentEl.offsetParent;}

			el.style.top = (top-13) + "px";
			el.style.left = (left+15) + "px";

			el.style.width = "";

			var width = _bottomPane.offsetWidth - left - 40;

			el.onmousemove = function(event) {event.stopPropagation();} //prevent disappearing act from body mousemove

			//add child to offsetParent so that position is correct
			offsetParent.appendChild(el);

			//make sure width is on screen
			if(el.offsetWidth > width)
				el.style.width = width + "px";
		} //end handlePlanParamsMouseMove()

					return;	//do nothing

						/////////////////////
						function(modifiedTables,err) //start addSubsetRecords handler
						{
					Debug.log("modifiedTables length " + modifiedTables.length);

					if(!modifiedTables.length)
					{
						if(err && err.indexOf("Entries in UID are not unique.") >= 0)
						{
							//not really an error, can use existing plan
							Debug.log("Using existing plan name.", Debug.INFO_PRIORITY);
						}

							//really an error
							Debug.err("There was an error while creating the " + _recordsAlias + " '" +

						//	CONFIGURE_ALIAS aliasMap[0]

							addCommand(_COMMAND_TYPES.BEGIN_LABEL,

							addCommand(_COMMAND_TYPES.REPEAT_LABEL,
									["Main",
									 0]); //"NumberOfRepetitions"
							addCommand(_COMMAND_TYPES.HALT,
									[]);
						}

						//FOR DEBUGGING
						//FOR DEBUGGING
						//FOR DEBUGGING
						if(0)

							addCommand(_COMMAND_TYPES.BEGIN_LABEL,

							addCommand(_COMMAND_TYPES.CHOOSE_FSM,

							addCommand(_COMMAND_TYPES.MODIFY_ACTIVE_GROUP,

									 5,//"FieldStartValue":params[4],

			//::::::::::::::::::::::::::::::::::::
			//localShowCommandDialog
			//	create command editor popup
			function localShowCommandDialog()
			{
				//use _popUpParamsModified to clear all existing dialogs
				//	because there could be more than one, if wizards are open
				if(_popUpParamsModified)
				{
					//remove all existing dialogs
					el = document.getElementById(ConfigurationAPI._POP_UP_DIALOG_ID);
					while(el)
					{
						el.parentNode.removeChild(el); //close popup
						el = document.getElementById(ConfigurationAPI._POP_UP_DIALOG_ID);
					}
				}

				if(!el) //make element if needed
				{
					el = document.createElement("div");
					el.setAttribute("id", ConfigurationAPI._POP_UP_DIALOG_ID);
				}

				el.style.display = "none";
				_popUpParamsModified = false; //reset

				//set position and size
				var w = 550;
				var h = 250; //+32 for each parameter
				ConfigurationAPI.setPopUpPosition(el,w /*w*/,h /*h*/,
						undefined /*padding*/,
						undefined /*border*/,

		//=====================================================================================
		//targetWizParentMultiSelectHandler ~~
		function targetWizParentMultiSelectHandler(sel)
		{
			var i = MultiSelectBox.getSelectedIndex(sel);
			var selArr = MultiSelectBox.getSelectionArray(sel);
			MultiSelectBox.dbg("ms Chosen element index:",i,
					"=", selArr[i],
					" value:",sel.innerHTML);

			//for(var s in selArr)
			//	MultiSelectBox.dbg("ms selected [" + s + "]: ",
			//			selArr[s]);

			var isChoiceSelected = selArr[i]?true:false;
			var feMode = document.getElementById("popUp-targetWizFEOnly").checked;
			var allUidMode = document.getElementById("popUp-targetWizAllUIDs").checked;

			var path = feMode?
					_FE_SUPERVISOR_TABLE:"";

			//remote mode: children come from the cached live FE list instead of getTree;
			//	synthesize the same {children:[{nodeName:"node", value}]} shape so
			//	localExtractTargetTree() below is shared with the local path
			var localRemoteChildren = function(supervisorName)
			{
				var info = _remoteFEMacroInfo[_cmdTargetWizRemoteSubsystem];
				var children = [];
				if(info)
				{
					var uids = [];
					for(var uid in info.fes)
						if((info.fes[uid].supervisor || "(unknown supervisor)") == supervisorName)
							uids.push(uid);
					uids.sort();
					for(var u=0;u<uids.length;++u)
						children.push({nodeName:"node", getAttribute:function(v){ return function(){ return v; }; }(uids[u])});
				}
				return {children:children};
			};

			//compare selected array to last selected array
			//	if allUidMode and different
			//		then load all children and take action
			//	else if not allUidMode just load the one that was clicked

			if(allUidMode)
			{
				var parentTable;

				for(var i=0;i<selArr.length;++i)
					if((_cmdTargetParentSelArr[i] ==
							undefined && selArr[i]) ||
							(_cmdTargetParentSelArr[i] != undefined &&
									_cmdTargetParentSelArr[i] != selArr[i]))
					{
						_cmdTargetParentSelArr[i] = selArr[i];

						//different, so load children and act

						parentTable = feMode?
								_FE_TABLE:
								MultiSelectBox.getSelectionElementByIndex(
									sel,i).innerText;

						if(_cmdTargetWizRemoteSubsystem != "")
						{
							localExtractTargetTree(
									localRemoteChildren(MultiSelectBox.getSelectionElementByIndex(sel,i).innerText),
									[parentTable,selArr[i]]);
							continue;
						}

						ConfigurationAPI.getTree(
								path +
								("/" +
								MultiSelectBox.getSelectionElementByIndex(
										sel,i).innerText) +
								(feMode?
								"/LinkToFEInterfaceTable":""),
								1, //down through command parameters
								_modifiedTables,
								localExtractTargetTree,
								[parentTable,selArr[i]] //pass parentTable and selected bool
						);
					}
					//else same, do nothing


				return;
			}


			//else not allUidMode


			_cmdTargetWizParentTable = feMode?
					_FE_TABLE:sel.innerText;

			if(_cmdTargetWizRemoteSubsystem != "")
			{
				localExtractTargetTree(localRemoteChildren(sel.innerText),
						[_cmdTargetWizParentTable,isChoiceSelected]);
				return;
			}

			path += "/" + sel.innerText;
			path += feMode?
					"/LinkToFEInterfaceTable":"";

			ConfigurationAPI.getTree(path,
					1, //down through command parameters
					_modifiedTables,
					localExtractTargetTree,
					[_cmdTargetWizParentTable,isChoiceSelected] //pass parentTable and selected bool
			);

			return;

			//::::::::::::::::::::::::::::::::::::
			//Extract UIDs from tree request and show in first box
			function localExtractTargetTree(tree,parentInfo)
			{
				if(!tree)
				{
					Debug.log("Invalid tree xml object.",Debug.HIGH_PRIORITY);
					return;
				}

				var msValues = [];
				var msSelected = []; //keep track of ms selected, even though it may not be displayed
				var found;

				Debug.log("parentTable " + parentInfo[0]);
				//_cmdTargetWizParentTable is only valid when not ALL
				Debug.log("_cmdTargetWizParentTable " + _cmdTargetWizParentTable);
				Debug.log("isChoiceSelected " + parentInfo[1]);

				//try for any errors in format
				try
				{
					var nodes = tree.children;
					for(var i=0;i<nodes.length;++i)
					{
						if(nodes[i].nodeName != "node")   continue;

						//Debug.log(nodes[i].getAttribute("value"));
						msValues.push(nodes[i].getAttribute("value"));

						//search targets for target
						found = false;
						for(var j=0;j<_cmdTargetObj.tables.length;++j)
						{
							if(_cmdTargetObj.tables[j] == parentInfo[0] &&
									_cmdTargetObj.uids[j] == msValues[i])
							{
								//target found in targets

								found = true;

								if(allUidMode && !isChoiceSelected)
								{
									Debug.log("Found " + _cmdTargetObj.tables[j] + "/" +
											_cmdTargetObj.uids[j] + ", clearing");

									//remove!
									_cmdTargetObj.tables.splice(j,1);
									_cmdTargetObj.uids.splice(j,1);
									msSelected.push(false);
								}
								else
									msSelected.push(true);

								break;
							}

						} //end loop through targets

						if(!found)
						{
							//target not found in targets
							if(allUidMode && isChoiceSelected)
							{
								Debug.log("Adding " + parentInfo[0] + "/" +
										msValues[i]);

								_cmdTargetObj.tables.push(parentInfo[0]);
								_cmdTargetObj.uids.push(msValues[i]);
								msSelected.push(true);
							}
							else
								msSelected.push(false);
						}
					}
				}
				catch(e)
				{
					Debug.log("Invalid tree xml object: " + e,Debug.HIGH_PRIORITY);
					return;
				}

				//clear
				document.getElementById("popUp-targetWiz-secondBox").innerHTML = "";

				targetWizDisplayTargets(); //update display

				if(!allUidMode)		//////////// make multiselect box
				{
					var noMultiSelect = false; // true or false (false for multiselect functionality)

					var msKeys = []; 	//group keys for multi-select
					var msTypes = [];	//back link strings for multi-select
					var sel = document.getElementById("popUp-targetWiz-secondBox");
					//write to a particular div
					MultiSelectBox.createSelectBox(
							sel,
							"targetWizSecondLevel",
							"Select '" + _cmdTargetWizParentTable + "' Targets:",
							msValues,msValues,msValues,
							targetWizRecordMultiSelectHandler /*select*/,
							noMultiSelect);


					//set pre-selections for uids already in group
					MultiSelectBox.initMySelectBoxes(false); //init but do not clear others
					var memberVal;
					for(var i=0;i<msSelected.length;++i)
					{
						MultiSelectBox.setSelectionElementByIndex(
								sel,i,msSelected[i]);
					}
					MultiSelectBox.initMySelectBoxes(false); //setup selections

				} //////////// end make multiselect box


			} //end localExtractTargetTree()
		} //end targetWizParentMultiSelectHandler()

		//=====================================================================================
		//getSystemAliasChoices ~~
		//	returns array of alias names: local aliases for Self, or the
		//	remote subsystem's advertised aliases when targetSubsystem is set
		function getSystemAliasChoices(targetSubsystem)
		{
			if(targetSubsystem && targetSubsystem != "")
			{
				for(var j=0;j<_remoteSubsystems.length;++j)
					if(_remoteSubsystems[j].name == targetSubsystem)
						return _remoteSubsystems[j].aliases.slice();
				return [];
			}
			var aliases = [];
			for(var j=0;j<_tableGroupAliases.length;++j)
				aliases.push(_tableGroupAliases[j].alias);
			return aliases;
		} //end getSystemAliasChoices()

		//=====================================================================================
		//getRemoteFEMacroInfo ~~
		//	fetch (or serve from cache) the live FE/macro info of a remote subsystem
		//	handler(info, errStr): info is undefined when errStr is non-empty
		function getRemoteFEMacroInfo(targetSubsystem, handler)
		{
			if(_remoteFEMacroInfo[targetSubsystem])
			{
				handler(_remoteFEMacroInfo[targetSubsystem], "");
				return;
			}

			DesktopContent.XMLHttpRequest(
				"Request?RequestType=getRemoteSubsystemFEMacroInfo" +
				"&targetSubsystem=" + encodeURIComponent(targetSubsystem),
				"",
				function(req, reqParam, errStr)
				{
					//with callHandlerOnErr, application-level errors arrive as an <Error>
					//	element in an otherwise successful response, so check both
					if(!errStr) errStr = "";
					var appErr = DesktopContent.getXMLValue(req, "Error");
					if(appErr && appErr != "")
						errStr += (errStr != "" ? "\n" : "") + appErr;
					if(errStr != "")
					{
						Debug.err("Could not get live front-end macro info from remote subsystem '" +
								targetSubsystem + "':\n\n" + errStr);
						handler(undefined, errStr);
						return;
					}

					var info = {fes:{}, publicMacros:{}};
					var localParseMacro = function(macroEl)
					{
						var macro = {inputs:[], outputs:[]};
						for(var c=0;c<macroEl.children.length;++c)
						{
							if(macroEl.children[c].nodeName == "input")
								macro.inputs.push(macroEl.children[c].getAttribute("value"));
							else if(macroEl.children[c].nodeName == "output")
								macro.outputs.push(macroEl.children[c].getAttribute("value"));
						}
						return macro;
					};

					var feEls = req.responseXML.getElementsByTagName("fe");
					for(var i=0;i<feEls.length;++i)
					{
						var fe = {type:"", supervisor:"", macros:{}};
						for(var c=0;c<feEls[i].children.length;++c)
						{
							var child = feEls[i].children[c];
							if(child.nodeName == "fe_type")
								fe.type = child.getAttribute("value");
							else if(child.nodeName == "fe_supervisor")
								fe.supervisor = child.getAttribute("value");
							else if(child.nodeName == "macro")
								fe.macros[child.getAttribute("value")] = localParseMacro(child);
						}
						info.fes[feEls[i].getAttribute("value")] = fe;
					}
					var pubEls = req.responseXML.getElementsByTagName("public_macro");
					for(var i=0;i<pubEls.length;++i)
						info.publicMacros[pubEls[i].getAttribute("value")] = localParseMacro(pubEls[i]);

					_remoteFEMacroInfo[targetSubsystem] = info;
					console.log("_remoteFEMacroInfo[" + targetSubsystem + "]", info);
					handler(info, "");
				},
				0 /*reqParam*/, 0 /*progressHandler*/,
				true /*callHandlerOnErr*/, false /*doNotShowLoadingOverlay*/,
				true /*targetGatewaySupervisor*/);
		} //end getRemoteFEMacroInfo()

		//=====================================================================================
		//getPopUpTargetSubsystem ~~
		//	returns the TargetSubsystem currently selected in the command dialog, or "" for Self

		//=====================================================================================
		//popUpTargetSubsystemOnChange ~~
		//	rebuild the SystemAlias select (if this command has one) for the new target
		function popUpTargetSubsystemOnChange(targetSubsystem)
		{
			Debug.log("popUpTargetSubsystemOnChange " + targetSubsystem);

			var type = document.getElementById("popUp-commandType").value;

			//re-render the macro controls for the new mode (remote select vs local text)
			var macroIndex = _COMMAND_PARAMS[type].indexOf("MacroName");
			if(macroIndex >= 0)
				popUpRenderMacroNameControl(macroIndex, targetSubsystem);

			var aliasIndex = _COMMAND_PARAMS[type].indexOf(_COMMAND_PARAM_FIELDS.SystemAlias);
			if(aliasIndex < 0) return; //no alias parameter for this command

			var sel = document.getElementById("popUp-param-" + aliasIndex);
			if(!sel) return;

			var previous = sel.value;
			var aliasChoices = getSystemAliasChoices(targetSubsystem);
			var str = "";
			var selectedAlias = aliasChoices.length ? aliasChoices[0] : "";
			for(var j=0;j<aliasChoices.length;++j)
			{
				if(aliasChoices[j] == previous)
					selectedAlias = aliasChoices[j];
				str += DesktopContent.htmlOpen("option" +
						(aliasChoices[j] == previous? " selected":""),
						{"value":aliasChoices[j]},
						aliasChoices[j] /*innerHTML*/, true /*closeTag*/);
			}
			sel.innerHTML = str;

			popUpParamSystemAliasOnChange(selectedAlias, targetSubsystem);
		} //end popUpTargetSubsystemOnChange()

		//=====================================================================================
		//popUpRenderMacroNameControl ~~
		//	Self: plain text input. Remote: select of live macros common to the selected
		//	target FEs (EXECUTE_FE_MACRO) or of MacroMaker public macros (EXECUTE_MM_MACRO),
		//	plus an "Other..." entry that reveals a text input. Preserves the current value.
		function popUpRenderMacroNameControl(paramIndex, targetSubsystem)
		{
			var wrapper = document.getElementById("popUp-macroNameWrapper-" + paramIndex);
			var hint = document.getElementById("popUp-macroInputsHint-" + paramIndex);
			if(!wrapper) return;

			var curEl = document.getElementById("popUp-param-" + paramIndex);
			var current = curEl ? curEl.value : "";

			var localRenderText = function()
			{
				wrapper.innerHTML = DesktopContent.htmlOpen("input",
						{
								"id":("popUp-param-" + paramIndex),
								"class":"popUp-param",
								"type":"text",
								"value":current,
								"onchange":"_popUpParamsModified = true;"
						}, 0 /*innerHTML*/, true /*closeTag*/);
				if(hint) hint.innerHTML = "";
			};

			if(!targetSubsystem || targetSubsystem == "")
			{
				localRenderText();
				return;
			}

			if(hint) hint.innerHTML = "Loading live macros from '" + targetSubsystem + "'...";

			getRemoteFEMacroInfo(targetSubsystem, function(info, errStr)
			{
				//dialog may have changed while waiting
				if(getPopUpTargetSubsystem() != targetSubsystem ||
						!document.getElementById("popUp-macroNameWrapper-" + paramIndex))
					return;

				if(errStr && errStr != "")
				{
					localRenderText();
					if(hint)
					{
						var span = document.createElement("span");
						span.style.color = "#a00";
						span.textContent = errStr; //escape server text
						hint.innerHTML = "";
						hint.appendChild(span);
					}
					return;
				}

				var type = document.getElementById("popUp-commandType").value;
				var isFEMacro = (type == _COMMAND_TYPES.EXECUTE_FE_MACRO);

				//candidate macro names
				var names = [];
				if(isFEMacro)
				{
					//intersection of macros across selected target UIDs
					var targetsIndex = _COMMAND_PARAMS[type].indexOf(_COMMAND_PARAM_FIELDS.Targets);
					var targetsEl = document.getElementById("popUp-param-" + targetsIndex);
					var uids = [];
					if(targetsEl)
					{
						var arr = targetsEl.value.split(',');
						for(var i=0;i<arr.length;++i)
							if(arr[i].indexOf('/') >= 0)
								uids.push(arr[i].split('/')[1]);
					}
					var counts = {};
					var liveUids = 0;
					for(var u=0;u<uids.length;++u)
					{
						var fe = info.fes[uids[u]];
						if(!fe) continue; //hand-typed or not live; ignore for intersection
						++liveUids;
						for(var m in fe.macros)
							counts[m] = (counts[m] || 0) + 1;
					}
					if(liveUids == 0) //no live targets selected yet: offer union of all FE macros
					{
						for(var uid in info.fes)
							for(var m in info.fes[uid].macros)
								counts[m] = 1, liveUids = 1;
					}
					for(var m in counts)
						if(counts[m] == liveUids)
							names.push(m);
				}
				else //EXECUTE_MM_MACRO: only PUBLIC MacroMaker macros can be run remotely
					for(var m in info.publicMacros)
						names.push(m);
				names.sort();

				var str = "";
				str += DesktopContent.htmlOpen("select",
						{
								"id":("popUp-param-" + paramIndex + "-select"),
								"class":"popUp-param",
								"onchange":"popUpMacroNameOnChange(" + paramIndex + "); _popUpParamsModified = true;"
						});
				var foundCurrent = false;
				for(var i=0;i<names.length;++i)
				{
					if(names[i] == current) foundCurrent = true;
					str += DesktopContent.htmlOpen("option" + (names[i] == current ? " selected" : ""),
							{"value":names[i]}, names[i], true /*closeTag*/);
				}
				var useOther = (!foundCurrent && current != "") || names.length == 0;
				str += DesktopContent.htmlOpen("option" + (useOther ? " selected" : ""),
						{"value":"__OTHER__"}, "Other...", true /*closeTag*/);
				str += "</select>";
				//hidden text input holds the actual parameter value read at submit
				str += DesktopContent.htmlOpen("input",
						{
								"id":("popUp-param-" + paramIndex),
								"class":"popUp-param",
								"type":"text",
								"value":(useOther ? current : (names.length ? (foundCurrent ? current : names[0]) : current)),
								"style":(useOther ? "" : "display:none;"),
								"onchange":"_popUpParamsModified = true;"
						}, 0 /*innerHTML*/, true /*closeTag*/);
				wrapper.innerHTML = str;

				popUpMacroNameOnChange(paramIndex, true /*noValueChange*/);
			});
		} //end popUpRenderMacroNameControl()

		//=====================================================================================
		//popUpMacroNameOnChange ~~
		//	sync the hidden MacroName text input with the select, and show input arg names
		function popUpMacroNameOnChange(paramIndex, noValueChange)
		{
			var sel = document.getElementById("popUp-param-" + paramIndex + "-select");
			var txt = document.getElementById("popUp-param-" + paramIndex);
			var hint = document.getElementById("popUp-macroInputsHint-" + paramIndex);
			if(!sel || !txt) return;

			if(sel.value == "__OTHER__")
			{
				txt.style.display = "";
				if(hint) hint.innerHTML = "Type a macro name; it will be validated when the plan runs.";
				return;
			}

			txt.style.display = "none";
			if(!noValueChange || txt.value == "")
				txt.value = sel.value;

			if(!hint) return;
			var ts = getPopUpTargetSubsystem();
			var info = _remoteFEMacroInfo[ts];
			if(!info) { hint.innerHTML = ""; return; }

			var type = document.getElementById("popUp-commandType").value;
			var macro;
			if(type == _COMMAND_TYPES.EXECUTE_FE_MACRO)
			{
				for(var uid in info.fes)
					if(info.fes[uid].macros[sel.value])
					{ macro = info.fes[uid].macros[sel.value]; break; }
			}
			else
				macro = info.publicMacros[sel.value];

			if(!macro) { hint.innerHTML = ""; return; }
			hint.innerHTML = "<b>Inputs:</b> " +
					(macro.inputs.length ? macro.inputs.join(", ") : "(none)") +
					"<br><b>Outputs:</b> " +
					(macro.outputs.length ? macro.outputs.join(", ") : "(none)");

			//argument editor depends on the selected macro's input names
			var argsIndex = _COMMAND_PARAMS[type].indexOf(_COMMAND_PARAM_FIELDS.MacroArgs);
			if(argsIndex >= 0 && document.getElementById("popUp-macroArgsEditor-" + argsIndex))
				renderMacroArgsEditor(argsIndex, ts);
		} //end popUpMacroNameOnChange()

		//=====================================================================================
		//macroArgsParse ~~
		//	"name:start:step:label,..." (pieces URI-encoded) -> [{name,start,step,label}]
		function macroArgsParse(str)
		{
			var args = [];
			if(!str) return args;
			var entries = str.split(',');
			for(var i=0;i<entries.length;++i)
			{
				if(entries[i] == "") continue;
				var p = entries[i].split(':');
				if(p.length < 3) continue;
				args.push({
					"name": decodeURIComponent(p[0]),
					"start": decodeURIComponent(p[1]),
					"step": decodeURIComponent(p[2]),
					"label": p.length > 3 ? decodeURIComponent(p[3]) : ""});
			}
			return args;
		} //end macroArgsParse()

		//=====================================================================================
		//macroArgsSerialize ~~
		function macroArgsSerialize(args)
		{
			var str = "";
			for(var i=0;i<args.length;++i)
			{
				if(args[i].name == "") continue;
				if(str != "") str += ",";
				str += encodeURIComponent(args[i].name) + ":" +
						encodeURIComponent(args[i].start) + ":" +
						encodeURIComponent(args[i].step) + ":" +
						encodeURIComponent(args[i].label || "");
			}
			return str;
		} //end macroArgsSerialize()

		//=====================================================================================
		//macroArgsSummary ~~
		//	compact display for the plan list, e.g. "dtcIndex=0+1@inner, gain=5+2"
		function macroArgsSummary(str)
		{
			var args = macroArgsParse(str);
			if(args.length == 0) return "(no args)";
			var out = "";
			for(var i=0;i<args.length;++i)
			{
				if(i) out += ", ";
				out += args[i].name + "=" + args[i].start;
				if(args[i].step == "DEFAULT" || args[i].step == "Default")
					out += " (const)";
				else if(parseFloat(args[i].step) != 0) //a step of 0 changes nothing, so do not show "+0"
					out += "+" + args[i].step;
				if(args[i].label) out += "@" + args[i].label;
			}
			return out;
		} //end macroArgsSummary()

		//=====================================================================================
		//macroArgsFromLoopTree ~~
		//	load side: convert the LinkToMacroDimensionalLoopTable tree node (loop rows ->
		//	parameter rows) into the MacroArgs wire string. Returns {macroArgs, legacy}.
		function macroArgsFromLoopTree(linkNode)
		{
			var result = {"macroArgs":"", "legacy":""};
			var loops = [];
			var loopNodes = linkNode.children;
			for(var m=0;m<loopNodes.length;++m)
			{
				if(loopNodes[m].nodeName != "node") continue; //skip GroupID/LinkTableName/etc
				var loop = {"priority":0, "nIter":"1", "label":"", "args":[]};
				var fields = loopNodes[m].children;
				for(var f=0;f<fields.length;++f)
				{
					if(fields[f].nodeName != "node") continue;
					var fname = fields[f].getAttribute("value");
					var fchildren = fields[f].children;
					if(fname == "DimensionalLoopPriority" && fchildren.length)
						loop.priority = parseInt(fchildren[0].getAttribute("value")) || 0;
					else if(fname == "NumberOfIterations" && fchildren.length)
						loop.nIter = fchildren[0].getAttribute("value");
					else if(fname == "StepLabel" && fchildren.length)
					{
						//an unset table column reads back as the "DEFAULT" sentinel = innermost loop
						loop.label = fchildren[0].getAttribute("value") || "";
						if(loop.label == "DEFAULT" || loop.label == "Default")
							loop.label = "";
					}
					else if(fname == "LinkToDimensionalLoopParameterTable")
					{
						for(var p=0;p<fchildren.length;++p)
						{
							if(fchildren[p].nodeName != "node") continue;
							var arg = {"name":"", "start":"", "step":"", "label":""};
							var pfields = fchildren[p].children;
							for(var q=0;q<pfields.length;++q)
							{
								if(pfields[q].nodeName != "node" || !pfields[q].children.length) continue;
								var pname = pfields[q].getAttribute("value");
								var pval = pfields[q].children[0].getAttribute("value");
								if(pname == "ParameterName") arg.name = pval;
								else if(pname == "ParameterInitialValue") arg.start = pval;
								else if(pname == "ParameterStepSize") arg.step = pval;
							}
							if(arg.name != "") loop.args.push(arg);
						}
					}
				}
				loops.push(loop);
			}
			loops.sort(function(a,b){ return a.priority - b.priority; });

			var args = [];
			for(var m=0;m<loops.length;++m)
			{
				if(loops[m].nIter != "1")
					result.legacy = "This command's loop tables were made outside the GUI " +
						"(NumberOfIterations=" + loops[m].nIter + "). They run unchanged until " +
						"this command is saved, which converts them to per-pass stepping.";
				for(var a=0;a<loops[m].args.length;++a)
				{
					loops[m].args[a].label = loops[m].label;
					args.push(loops[m].args[a]);
				}
			}
			result.macroArgs = macroArgsSerialize(args);
			return result;
		} //end macroArgsFromLoopTree()

		//=====================================================================================
		//getPlanOutputFilesHtml ~~
		//	builds the "Output files" section of the plan completion popup from the
		//	getIterationPlanStatus response: one line per file written by a macro command,
		//	with Code Editor links (same pattern as Console.html snapshot links).
		//	Local (Self) files open in this gateway's Code Editor; remote files open in the
		//	remote subsystem's Code Editor desktop icon (Desktop resolves origin/LID by name).
		//	Returns "" when the plan wrote no files.
		function getPlanOutputFilesHtml(req)
		{
			var subsystems = req.responseXML.getElementsByTagName("output_file_subsystem");
			var paths      = req.responseXML.getElementsByTagName("output_file_path");
			var labels     = req.responseXML.getElementsByTagName("output_file_label");
			var icons      = req.responseXML.getElementsByTagName("output_file_icon");
			if(!paths.length) return "";

			var str = "<br><br>Output file" + (paths.length == 1 ? "" : "s") + " (" + paths.length + "):<br>";
			for(var i=0;i<paths.length;++i)
			{
				var subsystem = i < subsystems.length ? subsystems[i].getAttribute("value") : "";
				var path      = paths[i].getAttribute("value");
				var label     = i < labels.length ? labels[i].getAttribute("value") : "";
				var icon      = i < icons.length ? icons[i].getAttribute("value") : "";

				//Display without the "//" MacroMaker puts after $OTSDAQ_DATA, but keep the
				//	reported path in the link: Code Editors built before the "$OTSDAQ_DATA/"
				//	offset fix (CodeEditor.cc) drop one character unless that extra "/" is there
				var displayPath = path.replace(/([^:])\/\/+/g, "$1/");
				var cleanPath = path;
				var where = (subsystem == "") ? "Self" : subsystem;

				//e.g. "CFO_HardwareGateway - DTC Read on Calo14_DTC0 iteration #2 [address = 37376 (0x9200)]: $OTSDAQ_DATA/macroOutput_....txt"
				str += "&nbsp;&nbsp;" + where + " - " + label + ": <b>" + displayPath + "</b> &nbsp;";

				if(subsystem == "") //local: open in this gateway's Code Editor (Console.html pattern)
				{
					var localUrl = "/WebPath/html/CodeEditor.html?urn=" + _codeEditorAppId +
							"&startFilePrimary=" + encodeURIComponent(cleanPath);
					str += "<a onclick='DesktopContent.openNewWindow(" +
							"\"Code Editor\",\"" + label.replace(/"/g,"") + "\"," +
							"\"" + localUrl + "\",0 /*unique*/);' " +
							"title='Click to open this output file in the Code Editor.'>" +
							"Open</a> &nbsp;&nbsp;&nbsp;";
					str += "<a onclick='DesktopContent.openNewBrowserTab(" +
							"\"Code Editor\",\"" + label.replace(/"/g,"") + "\"," +
							"\"" + localUrl + "\",0 /*unique*/);' " +
							"title='Click to open this output file in a new browser tab.'>" +
							"New Tab</a>";
				}
				else if(icon != "") //remote: open the subsystem's Code Editor icon by name, passing the file
				{
					//name-only open (subname/unique undefined) makes Desktop look up the icon,
					//	which carries the remote origin and gateway LID; the path is appended as GET params
					var remoteParams = "?startFilePrimary=" + encodeURIComponent(cleanPath);
					str += "<a onclick='DesktopContent.openNewWindow(" +
							"\"" + icon.replace(/"/g,"") + "\",undefined /*subname undefined for icon lookup*/," +
							"\"" + remoteParams + "\",undefined /*unique undefined for icon lookup*/);' " +
							"title='Click to open this output file in the Code Editor of " + where + ".'>" +
							"Open</a> &nbsp;&nbsp;&nbsp;";
					str += "<a onclick='DesktopContent.openNewBrowserTab(" +
							"\"" + icon.replace(/"/g,"") + "\",undefined /*subname undefined for icon lookup*/," +
							"\"" + remoteParams + "\",undefined /*unique undefined for icon lookup*/);' " +
							"title='Click to open this output file in a new browser tab.'>" +
							"New Tab</a>";
				}
				else //remote, but no Code Editor icon known for that subsystem
					str += "<label style='font-size:12px;'>(file is on " + where +
							"; no Code Editor icon found for that subsystem)</label>";
				str += "<br>";
			}
			return str;
		} //end getPlanOutputFilesHtml()

		//=====================================================================================
		//getEnclosingLabels ~~
		//	labels whose BEGIN_LABEL is before commandIndex and matching REPEAT_LABEL after,
		//	innermost first: [{label, passes}]. commandIndex may equal _commands.length
		//	(inserting at end) -- then nothing encloses it.
		//	isInsert: the command is NEW and goes in front of the command currently at
		//	commandIndex, so that command still counts (e.g. it may be the REPEAT_LABEL that
		//	closes the loop). Otherwise the command at commandIndex is being modified/replaced
		//	and is ignored.
		function getEnclosingLabels(commandIndex, isInsert)
		{
			var open = []; //stack of {label, beginIndex}
			var enclosing = []; //captured when reaching commandIndex
			for(var i=0;i<_commands.length;++i)
			{
				if(i == commandIndex)
				{
					for(var s=open.length-1;s>=0;--s)
						enclosing.push({"label":open[s].label, "passes":0, "beginIndex":open[s].beginIndex});
					if(!isInsert)
						continue; //the command being modified does not count
				}
				var isAfterCommand = isInsert ? (i >= commandIndex) : (i > commandIndex);
				if(_commands[i].type == _COMMAND_TYPES.BEGIN_LABEL)
					open.push({"label":_commands[i].param["Label"], "beginIndex":i});
				else if(_commands[i].type == _COMMAND_TYPES.REPEAT_LABEL)
				{
					var reps = parseInt(_commands[i].param["NumberOfRepetitions"]) || 0;
					for(var s=open.length-1;s>=0;--s)
						if(open[s].label == _commands[i].param["Label"])
						{
							if(isAfterCommand)
								for(var e=0;e<enclosing.length;++e)
									if(enclosing[e].beginIndex == open[s].beginIndex)
										enclosing[e].passes = reps + 1;
							open.splice(s, 1);
							break;
						}
				}
			}
			//labels never closed after the command do not enclose it
			var closed = [];
			for(var e=0;e<enclosing.length;++e)
				if(enclosing[e].passes > 0)
					closed.push(enclosing[e]);
			return closed;
		} //end getEnclosingLabels()

		//=====================================================================================
		//getCommandRunCount ~~
		//	how many times the command at commandIndex executes in one play of the plan:
		//	the product of the pass counts of every enclosing Label/Repeat loop.
		//	For a BEGIN_LABEL the "runs" is how many times the label is entered from outside;
		//	the body of that loop then runs (runs x passes) times.
		//	Returns {runs, passes, loops:[{label,passes}]}; passes is only set for BEGIN_LABEL.
		function getCommandRunCount(commandIndex)
		{
			var result = {"runs":1, "passes":0, "loops":getEnclosingLabels(commandIndex)};
			for(var l=0;l<result.loops.length;++l)
				result.runs *= result.loops[l].passes;

			if(_commands[commandIndex] &&
					_commands[commandIndex].type == _COMMAND_TYPES.BEGIN_LABEL)
			{
				//find this label's own REPEAT_LABEL to get its pass count
				var label = _commands[commandIndex].param["Label"];
				var depth = 0;
				for(var i=commandIndex+1;i<_commands.length;++i)
				{
					if(_commands[i].type == _COMMAND_TYPES.BEGIN_LABEL)
						++depth;
					else if(_commands[i].type == _COMMAND_TYPES.REPEAT_LABEL)
					{
						if(depth == 0 && _commands[i].param["Label"] == label)
						{
							result.passes = (parseInt(_commands[i].param["NumberOfRepetitions"]) || 0) + 1;
							break;
						}
						--depth;
					}
				}
			}
			return result;
		} //end getCommandRunCount()

		//=====================================================================================
		//commandRunCountBadge ~~ small html badge for the plan list; "" when nothing to say
		function commandRunCountBadge(commandIndex)
		{
			var rc = getCommandRunCount(commandIndex);
			var cmd = _commands[commandIndex];
			if(!cmd) return "";
			var text = "", title = "";
			var loopList = "";
			for(var l=0;l<rc.loops.length;++l)
				loopList += (l ? " × " : "") + rc.loops[l].label + " (" + rc.loops[l].passes + ")";

			if(cmd.type == _COMMAND_TYPES.BEGIN_LABEL)
			{
				if(rc.passes == 0)
					return "<span style='color:#a00; font-size:11px;'>(no matching REPEAT_LABEL)</span>";
				var bodyRuns = rc.runs * rc.passes;
				text = rc.passes + " pass" + (rc.passes == 1 ? "" : "es") +
						(rc.runs > 1 ? " × " + rc.runs + " = " + bodyRuns + " total" : "");
				title = "Label '" + cmd.param["Label"] + "' is entered " + rc.runs + " time" +
						(rc.runs == 1 ? "" : "s") + (rc.loops.length ? " (enclosing loops: " + loopList + ")" : "") +
						" and repeats " + rc.passes + " pass" + (rc.passes == 1 ? "" : "es") +
						" each time, so the commands inside run " + bodyRuns + " time" + (bodyRuns == 1 ? "" : "s") + ".";
			}
			else if(cmd.type == _COMMAND_TYPES.REPEAT_LABEL)
			{
				//the stored number is how many times the iterator jumps BACK to the
				//	label, so the body always runs one more time than the number says
				var reps = parseInt(cmd.param["NumberOfRepetitions"]) || 0;
				var passes = reps + 1;
				text = passes + " pass" + (passes == 1 ? "" : "es") + " total";
				title = "NumberOfRepetitions = " + reps + " means the loop body runs once, then " +
						"repeats " + reps + " more time" + (reps == 1 ? "" : "s") + ", so " +
						passes + " pass" + (passes == 1 ? "" : "es") + " in total" +
						(rc.loops.length ? " each time label '" + cmd.param["Label"] +
						"' is entered (enclosing loops: " + loopList + ")" : "") + ".";
			}
			else if(cmd.type == _COMMAND_TYPES.CHOOSE_FSM)
				return ""; //bookkeeping command; count is not informative
			else
			{
				if(rc.loops.length == 0) return ""; //runs once, nothing to flag
				text = "runs ×" + rc.runs;
				title = "This command runs " + rc.runs + " time" + (rc.runs == 1 ? "" : "s") +
						" per play of the plan (enclosing loops: " + loopList + ").";
			}
			return "<span title='" + title.replace(/'/g, "&#39;") + "' style='background:rgb(213,224,205); " +
					"border-radius:3px; padding:0 4px; font-size:11px; position:relative; top:-1px; " +
					"margin-left:4px; white-space:nowrap;'>" + text + "</span>";
		} //end commandRunCountBadge()

		//=====================================================================================
		//repeatHintText ~~ plain-language total for a NumberOfRepetitions value
		function repeatHintText(value)
		{
			var reps = parseInt(value);
			if(isNaN(reps)) return "enter a whole number, 0 or more";
			if(reps < 0) return "= 1 pass total (negative counts as 0)";
			var passes = reps + 1;
			return "= " + passes + " pass" + (passes == 1 ? "" : "es") + " total";
		} //end repeatHintText()

		//=====================================================================================
		//popUpUpdateRepeatHint ~~ refresh the total-passes hint next to the input in the command dialog
		function popUpUpdateRepeatHint(paramIndex)
		{
			var inEl = document.getElementById("popUp-param-" + paramIndex);
			var hintEl = document.getElementById("popUp-repeatHint-" + paramIndex);
			if(inEl && hintEl) hintEl.innerHTML = repeatHintText(inEl.value);
		} //end popUpUpdateRepeatHint()

		//=====================================================================================
		//getMacroArgsHelpText ~~
		//	explanation shown by DesktopContent.tooltip when the argument editor opens
		function getMacroArgsHelpText()
		{
			return "This editor sets the <b>input arguments</b> that the FE Macro (or Macro) receives " +
				"each time this command runs. In an Iteration Plan a command usually sits inside a " +
				"<b>BEGIN_LABEL ... REPEAT_LABEL</b> pair, so it runs once per <i>pass</i> of that loop. " +
				"The arguments can change from pass to pass.\n\n" +

				"<b>Each argument row has four fields:</b>\n" +
				"<INDENT>" +
				"- <b>Input argument</b>: which macro input this row sets (pick from the list the macro " +
				"reports, or choose <i>Other...</i> to type a name).\n" +
				"- <b>Start value</b>: the value used on the first pass.\n" +
				"- <b>Step per pass</b>: how much is added each pass. Use <b>0</b> to keep a number fixed, " +
				"or <b>DEFAULT</b> to pass a fixed piece of text (e.g. <i>true</i> or <i>auto</i>).\n" +
				"- <b>Advance with loop</b>: which enclosing Label/Repeat loop counts the passes for this " +
				"row. <i>nearest loop</i> means the innermost loop around the command." +
				"</INDENT>\n" +

				"On a given pass the value sent is: <b>start + step &times; pass number</b> " +
				"(pass numbers start at 0). A REPEAT_LABEL with <i>NumberOfRepetitions</i> = N gives " +
				"N+1 passes.\n\n" +

				"<b>Example - one loop:</b>\n" +
				"<INDENT>" +
				"1. BEGIN_LABEL scan\n" +
				"2. EXECUTE_FE_MACRO   with   dtcIndex: start 0, step 1, advance with <i>scan</i>\n" +
				"3. REPEAT_LABEL scan, 3\n" +
				"</INDENT>" +
				"The macro runs 4 times with dtcIndex = 0, 1, 2, 3.\n\n" +

				"<b>Example - two dimensions (an A x B grid):</b>\n" +
				"Nest two loops and bind one argument to each. Any other commands (configure, run, " +
				"wait...) can sit inside the loops as well.\n" +
				"<INDENT>" +
				"1. BEGIN_LABEL outer\n" +
				"2.    BEGIN_LABEL inner\n" +
				"3.       EXECUTE_FE_MACRO   with   gain: 5, step 2, advance with <i>outer</i>;   " +
				"dtcIndex: 0, step 1, advance with <i>inner</i>\n" +
				"4.    REPEAT_LABEL inner, 3\n" +
				"5. REPEAT_LABEL outer, 2\n" +
				"</INDENT>" +
				"The macro runs 3 x 4 = 12 times. <i>dtcIndex</i> cycles 0,1,2,3 and resets each time " +
				"<i>outer</i> advances; <i>gain</i> holds 5 for the first four runs, then 7, then 9. " +
				"Add a third loop for a third dimension.\n\n" +

				"<b>Tips:</b>\n" +
				"<INDENT>" +
				"- <i>+ add all macro inputs</i> creates a row for every input, prefilled from the " +
				"default shown in the input's name (e.g. <i>(Default := -1)</i>).\n" +
				"- The macro will refuse to run until every input it declares has a row; the red " +
				"text below the table lists what is missing.\n" +
				"- The preview line under the table shows how many times the macro will run and the " +
				"values each argument will take, so you can check the plan before saving.\n" +
				"- If a row says <i>(not enclosing!)</i>, the command was moved outside the loop it " +
				"was bound to - pick another loop." +
				"</INDENT>";
		} //end getMacroArgsHelpText()

		//=====================================================================================
		//showMacroArgsHelp ~~ re-open the argument help regardless of per-user dismissal
		function showMacroArgsHelp()

			DesktopContent.tooltip("Iterate Macro Arguments", getMacroArgsHelpText(),

		//=====================================================================================
		//renderMacroArgsEditor ~~
		//	visible editor for the MacroArgs parameter: rows of
		//	[argument select][start][step][steps-with label select][x], plus preview
		function renderMacroArgsEditor(paramIndex, targetSubsystem)
		{
			var wrapper = document.getElementById("popUp-macroArgsEditor-" + paramIndex);
			var hidden = document.getElementById("popUp-param-" + paramIndex);
			if(!wrapper || !hidden) return;
			if(targetSubsystem === undefined) targetSubsystem = getPopUpTargetSubsystem();

			var args = macroArgsParse(hidden.value);
			var type = document.getElementById("popUp-commandType").value;

			//known input names for the selected macro (if info is cached)
			var inputNames = [];
			var info = _remoteFEMacroInfo[targetSubsystem];
			var macroIndex = _COMMAND_PARAMS[type].indexOf("MacroName");
			var macroEl = macroIndex >= 0 ? document.getElementById("popUp-param-" + macroIndex) : null;
			var macroName = macroEl ? macroEl.value : "";
			if(info && macroName != "")
			{
				var macro;
				if(type == _COMMAND_TYPES.EXECUTE_FE_MACRO)
				{
					for(var uid in info.fes)
						if(info.fes[uid].macros[macroName])
						{ macro = info.fes[uid].macros[macroName]; break; }
				}
				else
					macro = info.publicMacros[macroName];
				if(macro) inputNames = macro.inputs.slice();
			}

			//enclosing labels for this command position
			var labels = getEnclosingLabels(_popUpCommandIndex, _popUpCommandIsInsert);

			//one-time (per user) explanation of how arguments advance with plan loops
			if(!_macroArgsTooltipShown)
			{
				_macroArgsTooltipShown = true;
				DesktopContent.tooltip("Iterate Macro Arguments", getMacroArgsHelpText());
			}

			//(the one-line explanation and legacy note are in the MacroArgs value cell, see localShowParamControls)
			var str = "";
			var td = "style='padding:2px 6px 2px 0; vertical-align:middle;'";
			str += "<table style='font-size:12px; border-collapse:collapse;'>";
			if(args.length)
				str += "<tr style='color:#555; font-size:11px;'>" +
					"<td " + td + ">Input-arg</td>" +
					"<td " + td + ">Start-val</td>" +
					"<td " + td + ">Step-size</td>" +
					"<td " + td + ">Step-with-loop</td>" +
					"<td " + td + "></td></tr>";
			for(var a=0;a<args.length;++a)
			{
				str += "<tr>";
				//argument name: select of known inputs + Other
				str += "<td " + td + ">";
				var known = inputNames.indexOf(args[a].name) >= 0;
				if(inputNames.length)
				{
					str += DesktopContent.htmlOpen("select",
							{"id":"popUp-macroArg-name-" + paramIndex + "-" + a,
							 "style":"width:130px",
							 "onchange":"macroArgsEditorChanged(" + paramIndex + ")"});
					for(var n=0;n<inputNames.length;++n)
						str += DesktopContent.htmlOpen("option" + (inputNames[n] == args[a].name ? " selected" : ""),
								{"value":inputNames[n]}, inputNames[n], true);
					str += DesktopContent.htmlOpen("option" + (!known ? " selected" : ""),
							{"value":"__OTHER__"}, "Other...", true);
					str += "</select>";
				}
				str += DesktopContent.htmlOpen("input",
						{"id":"popUp-macroArg-nameText-" + paramIndex + "-" + a,
						 "type":"text", "value":args[a].name,
						 "style":"width:120px;" + ((inputNames.length && known) ? "display:none;" : ""),
						 "onchange":"macroArgsEditorChanged(" + paramIndex + ")"}, 0, true);
				str += "</td>";
				str += "<td " + td + ">" + DesktopContent.htmlOpen("input",
						{"id":"popUp-macroArg-start-" + paramIndex + "-" + a,
						 "type":"text", "value":args[a].start, "style":"width:70px",
						 "title":"Value on the first pass",
						 "onchange":"macroArgsEditorChanged(" + paramIndex + ")"}, 0, true) + "</td>";
				str += "<td " + td + ">" + DesktopContent.htmlOpen("input",
						{"id":"popUp-macroArg-step-" + paramIndex + "-" + a,
						 "type":"text", "value":args[a].step, "style":"width:70px",
						 "title":"Added to the value on every pass. Use DEFAULT to keep a fixed text value.",
						 "onchange":"macroArgsEditorChanged(" + paramIndex + ")"}, 0, true) + "</td>";
				//which enclosing Label/Repeat loop counts the passes
				str += "<td " + td + ">";
				str += DesktopContent.htmlOpen("select",
						{"id":"popUp-macroArg-label-" + paramIndex + "-" + a,
						 "style":"width:150px",
						 "title":"The BEGIN_LABEL/REPEAT_LABEL pair whose pass number is used",
						 "onchange":"macroArgsEditorChanged(" + paramIndex + ")"});
				str += DesktopContent.htmlOpen("option" + (args[a].label == "" ? " selected" : ""),
						{"value":""}, labels.length ? "nearest loop: " + labels[0].label : "(no enclosing loop)", true);
				var labelFound = (args[a].label == "");
				for(var l=0;l<labels.length;++l)
				{
					if(labels[l].label == args[a].label) labelFound = true;
					str += DesktopContent.htmlOpen("option" + (labels[l].label == args[a].label ? " selected" : ""),
							{"value":labels[l].label},
							labels[l].label + " (" + labels[l].passes + " pass" + (labels[l].passes == 1 ? "" : "es") + ")", true);
				}
				if(!labelFound) //bound label no longer encloses this command
					str += DesktopContent.htmlOpen("option selected", {"value":args[a].label},
							args[a].label + " (not enclosing!)", true);
				str += "</select></td>";
				str += "<td " + td + ">" + DesktopContent.htmlOpen("a",
						{"href":"#", "title":"Remove this argument", "style":"text-decoration:none; color:#a00; font-weight:bold;",
						 "onclick":"macroArgsEditorRemove(" + paramIndex + "," + a + "); return false;"}, "x", true) + "</td>";
				str += "</tr>";
			}
			str += "</table>";
			str += DesktopContent.htmlOpen("a",
					{"href":"#", "style":"font-size:12px; margin-right:12px;",
					 "onclick":"macroArgsEditorAdd(" + paramIndex + "); return false;"}, "+ add argument", true);
			//offer to add every macro input that has no row yet (prefilled from "(Default := x)" hints)
			var missing = [];
			for(var n=0;n<inputNames.length;++n)
			{
				var have = false;
				for(var a=0;a<args.length;++a) if(args[a].name == inputNames[n]) have = true;
				if(!have) missing.push(inputNames[n]);
			}
			if(missing.length)
				str += DesktopContent.htmlOpen("a",
						{"href":"#", "style":"font-size:12px;",
						 "title":"Adds one row per macro input, using the input's default value as the start value",
						 "onclick":"macroArgsEditorAddAll(" + paramIndex + "); return false;"},
						"+ add all " + missing.length + " macro input" + (missing.length == 1 ? "" : "s"), true);

			//preview + warnings
			str += "<div id='popUp-macroArgs-preview-" + paramIndex + "' style='font-size:11px; color:#333; margin-top:3px;'></div>";
			wrapper.innerHTML = str;

			//the parameter table is centered in the popup; shift the editor (visually only,
			//	position:relative) so its left edge sits 10px in from the popup's left edge
			//	and all four columns fit in the 550px dialog
			wrapper.style.position = "relative";
			wrapper.style.left = "0px";
			var popEl = document.getElementById(ConfigurationAPI._POP_UP_DIALOG_ID);
			if(popEl)
			{
				var shift = wrapper.getBoundingClientRect().left -
						(popEl.getBoundingClientRect().left + 10 /*px from popup edge*/);
				if(shift > 0)
					wrapper.style.left = (-shift) + "px";
			}

			macroArgsEditorPreview(paramIndex, args, labels, inputNames);
		} //end renderMacroArgsEditor()

		//=====================================================================================
		//macroArgsEditorRead ~~ read editor rows back into [{name,start,step,label}]
		function macroArgsEditorRead(paramIndex)
		{
			var args = [];
			for(var a=0;;++a)
			{
				var startEl = document.getElementById("popUp-macroArg-start-" + paramIndex + "-" + a);
				if(!startEl) break;
				var sel = document.getElementById("popUp-macroArg-name-" + paramIndex + "-" + a);
				var txt = document.getElementById("popUp-macroArg-nameText-" + paramIndex + "-" + a);
				var name = txt.value;
				if(sel && sel.value != "__OTHER__") name = sel.value;
				args.push({
					"name": name,
					"start": startEl.value,
					"step": document.getElementById("popUp-macroArg-step-" + paramIndex + "-" + a).value,
					"label": document.getElementById("popUp-macroArg-label-" + paramIndex + "-" + a).value});
			}
			return args;
		} //end macroArgsEditorRead()

		//=====================================================================================
		function macroArgsEditorChanged(paramIndex)
		{
			_popUpParamsModified = true;
			var args = macroArgsEditorRead(paramIndex);
			//when Other... is chosen, keep the row's name empty so the text box shows for typing
			for(var a=0;a<args.length;++a)
			{
				var sel = document.getElementById("popUp-macroArg-name-" + paramIndex + "-" + a);
				var txt = document.getElementById("popUp-macroArg-nameText-" + paramIndex + "-" + a);
				if(sel && sel.value == "__OTHER__" && txt) args[a].name = txt.value;
			}
			document.getElementById("popUp-param-" + paramIndex).value = macroArgsSerialize(args);
			renderMacroArgsEditor(paramIndex); //re-render so Other/name text and labels stay in sync
		} //end macroArgsEditorChanged()

		//=====================================================================================
		//macroArgsCurrentInputs ~~ input names of the macro selected in the open dialog ([] if unknown)
		function macroArgsCurrentInputs()
		{
			var type = document.getElementById("popUp-commandType").value;
			var info = _remoteFEMacroInfo[getPopUpTargetSubsystem()];
			var macroIndex = _COMMAND_PARAMS[type].indexOf("MacroName");
			var macroEl = macroIndex >= 0 ? document.getElementById("popUp-param-" + macroIndex) : null;
			if(!info || !macroEl) return [];
			var macro;
			if(type == _COMMAND_TYPES.EXECUTE_FE_MACRO)
			{
				for(var uid in info.fes)
					if(info.fes[uid].macros[macroEl.value])
					{ macro = info.fes[uid].macros[macroEl.value]; break; }
			}
			else macro = info.publicMacros[macroEl.value];
			return macro ? macro.inputs.slice() : [];
		} //end macroArgsCurrentInputs()

		//=====================================================================================
		//macroArgsDefaultRow ~~
		//	FE macro input names often carry a hint like "(Default := 0x0c)" or "(Default = -1 := all)";
		//	use it: numeric default -> start=default, step=0; text default -> fixed text (step DEFAULT)
		function macroArgsDefaultRow(name)
		{
			var row = {"name":name, "start":"0", "step":"0", "label":""};
			var m = /\(\s*Default\s*(?::=|=)\s*([^,)\s:]+)/i.exec(name);
			if(m)
			{
				var def = m[1];
				if(def.toLowerCase() == "default") def = "";
				if(def != "" && (!isNaN(parseFloat(def)) || /^0x[0-9a-f]+$/i.test(def)))
					row.start = def;
				else if(def != "")
				{ row.start = def; row.step = "DEFAULT"; }
			}
			return row;
		} //end macroArgsDefaultRow()

		//=====================================================================================
		function macroArgsEditorAdd(paramIndex)
		{
			_popUpParamsModified = true;
			var args = macroArgsEditorRead(paramIndex);
			//default to the first known input not yet used
			var name = "";
			var inputs = macroArgsCurrentInputs();
			for(var n=0;n<inputs.length;++n)
			{
				var used = false;
				for(var a=0;a<args.length;++a) if(args[a].name == inputs[n]) used = true;
				if(!used) { name = inputs[n]; break; }
			}
			//serialize drops empty names, so give a placeholder that the user overwrites
			args.push(macroArgsDefaultRow(name != "" ? name : "arg" + (args.length+1)));
			document.getElementById("popUp-param-" + paramIndex).value = macroArgsSerialize(args);
			renderMacroArgsEditor(paramIndex);
		} //end macroArgsEditorAdd()

		//=====================================================================================
		function macroArgsEditorAddAll(paramIndex)
		{
			_popUpParamsModified = true;
			var args = macroArgsEditorRead(paramIndex);
			var inputs = macroArgsCurrentInputs();
			for(var n=0;n<inputs.length;++n)
			{
				var used = false;
				for(var a=0;a<args.length;++a) if(args[a].name == inputs[n]) used = true;
				if(!used) args.push(macroArgsDefaultRow(inputs[n]));
			}
			document.getElementById("popUp-param-" + paramIndex).value = macroArgsSerialize(args);
			renderMacroArgsEditor(paramIndex);
		} //end macroArgsEditorAddAll()

		//=====================================================================================
		function macroArgsEditorRemove(paramIndex, argIndex)
		{
			_popUpParamsModified = true;
			var args = macroArgsEditorRead(paramIndex);
			args.splice(argIndex, 1);
			document.getElementById("popUp-param-" + paramIndex).value = macroArgsSerialize(args);
			renderMacroArgsEditor(paramIndex);
		} //end macroArgsEditorRemove()

		//=====================================================================================
		//macroArgsEditorPreview ~~ combinations + per-argument value lists + warnings
		function macroArgsEditorPreview(paramIndex, args, labels, inputNames)
		{
			var el = document.getElementById("popUp-macroArgs-preview-" + paramIndex);
			if(!el) return;
			var passesOf = function(label)
			{
				if(labels.length == 0) return 1;
				if(label == "") return labels[0].passes;
				for(var l=0;l<labels.length;++l) if(labels[l].label == label) return labels[l].passes;
				return 1;
			};
			var isConst = function(step) { return step == "DEFAULT" || step == "Default" ||
					(step !== "" && parseFloat(step) === 0); }; //step 0 is also a constant, value passed through as-is
			var isNum = function(s) { return s !== "" && !isNaN(parseFloat(s)); };

			var str = "";
			var warnings = [];
			var boundLabels = {};
			var combos = 1;
			var lists = [];
			for(var a=0;a<args.length;++a)
			{
				if(args[a].name == "") { warnings.push("An argument has no name."); continue; }
				if(inputNames.length && inputNames.indexOf(args[a].name) < 0)
					warnings.push("'" + args[a].name + "' is not an input of the selected macro.");
				if(isConst(args[a].step)) { lists.push(args[a].name + " = '" + args[a].start + "' (constant)"); continue; }
				if(!isNum(args[a].start) || !isNum(args[a].step))
				{
					warnings.push("'" + args[a].name + "' needs numeric start and step (or step DEFAULT for a constant string).");
					continue;
				}
				var key = args[a].label == "" ? (labels.length ? labels[0].label : "") : args[a].label;
				var n = passesOf(args[a].label);
				if(!boundLabels[key]) { boundLabels[key] = n; combos *= n; }
				var vals = [];
				for(var p=0;p<n && p<6;++p)
					vals.push(+(parseFloat(args[a].start) + parseFloat(args[a].step)*p).toPrecision(10));
				lists.push(args[a].name + " &isin; {" + vals.join(", ") + (n > 6 ? ", &hellip;" : "") + "}" +
						(key ? " @" + key : ""));
			}
			var uncovered = [];
			for(var n=0;n<inputNames.length;++n)
			{
				var covered = false;
				for(var a=0;a<args.length;++a) if(args[a].name == inputNames[n]) covered = true;
				if(!covered) uncovered.push(inputNames[n]);
			}
			if(uncovered.length)
				warnings.push("The macro will not run until every input has a row. Missing: " +
						uncovered.join("; ") + ".");

			if(args.length == 0)
				str += inputNames.length ?
						"No arguments defined yet &mdash; use <i>+ add all macro inputs</i> above." :
						"No input arguments.";
			else if(labels.length == 0)
				str += "This command is not inside a Label/Repeat loop, so it runs once with the start values.";
			else
				str += "<b>" + combos + "</b> run" + (combos == 1 ? "" : "s") + " of the macro: " + lists.join("; ");
			for(var w=0;w<warnings.length;++w)
				str += "<br><span style='color:#a00'>" + warnings[w] + "</span>";
			el.innerHTML = str;
		} //end macroArgsEditorPreview()
