			var _AREAS = ['selection','rundbviewer'];
			var _areaEls = [0,0];

			var _MARGIN = 20;
			var _SELECTION_FILTER_HEIGHT = 338;
			var _AREA_HEIGHTS = [270,500];

			var _isAreaExpanded = [false, true];

			var _runInfoPluginName = "";
			var _runInfoPluginUID = "";

			var _activeRunType = "";
			var _defaultRunType = "";//if "" goes with default run type
			var _runTypeArray = [];

			var _refreshDayIndex = 0; 	//init to most recent because two undefines, 0=today, 1=yesterday, etc..
			var _refreshDuration = 2;	//init to 2 days
			var _mostRecentDayIndex = -1;
			var _rundbviewerUpdateTimer = 0;
			var _REFRESH_INTERVAL = 10000; //10 seconds

			var _TIMEZONE_OFFSET_HOURS = (new Date().getTimezoneOffset())/60;

			var _XML_STATUS 										= "rundbviewer_status";
			var _XML_RUNTYPE_LIST 									= "run_type_list";
			var _XML_MOST_RECENT_DAY 								= "most_recent_day";
			var _XML_RUNDBVIEWER_ENTRY 								= "rundbviewer_entry";
			var _XML_RUNDBVIEWER_ENTRY_RUN_NUMBER				 	= "rundbviewer_entry_run_number";
			var _XML_RUNDBVIEWER_ENTRY_RUN_TIME 					= "rundbviewer_entry_run_time";
			var _XML_RUNDBVIEWER_ENTRY_RUN_TYPE 					= "rundbviewer_entry_run_type";
			var _XML_RUNDBVIEWER_ENTRY_RUN_ARTDAQ_PARTITION 		= "rundbviewer_entry_run_artdaq_partition";
			var _XML_RUNDBVIEWER_ENTRY_RUN_START_TIME				= "start_time"
			var _XML_RUNDBVIEWER_ENTRY_RUN_STOP_TIME				= "stop_time"
			var _XML_RUNDBVIEWER_ENTRY_RUN_HOST_NAME				= "host_name"
			var _XML_RUNDBVIEWER_ENTRY_RUN_CONDIOTION_ID			= "condition_id"
			var _XML_RUNDBVIEWER_ENTRY_RUN_CONFIGURATION_NAME		= "configuration_name"

			var _XML_RUNDBVIEWER_ENTRY_RUN_CONTEXT_NAME	 			= "context_name"
			var _XML_RUNDBVIEWER_ENTRY_RUN_CONTEXT_VERSION	 		= "context_version"
			var _XML_RUNDBVIEWER_ENTRY_RUN_ONLINE_SOFTWARE_VERSION	= "online_software_version"
			var _XML_RUNDBVIEWER_ENTRY_RUN_SHIFTER_NOTE				= "shifter_note"
			var _XML_RUNDBVIEWER_ENTRY_RUN_STATUS					= "run_status"
			var _XML_RUNDBVIEWER_ENTRY_RUN_END_NOTE					= "end_note"
			var _XML_RUNDBVIEWER_ENTRY_SUBSYSTEM_CONFIG_RECORD 	 	= "subsystem_config_record"

			var _allEntries = []; //raw XML entry elements from last response
			var _activeStatusFilter = ""; //empty = show all

			/////////////////////////////////////////////////////////////////////////////////////////

			//=====================================================================================
			//init called once body has loaded
			function init()
			{
				Debug.log("init()");

				if(DesktopContent._windowMessagingInactive) //assume in standalone mode
				{
					Debug.log("Standalone mode detected -- Enabling navigation prompt");
					// Enable navigation prompt
					//	(to prevent accidental/back/forward/nav leaving the page) "Leave page?" on chrome
					window.onbeforeunload = function() {
						return true;
					};

					window.parent.document.title = "ots run info database";
				}

				//init area elements
				for(var i=0;i<_AREAS.length;++i)
					_areaEls[i] = document.getElementById(_AREAS[i] + 'Area');

				//get default run type from url
				//setActiveSelection(DesktopContent.getParameter(1));
				_defaultRunType = DesktopContent.getDesktopWindowParameter(0,"runType");
				if (_defaultRunType == "DEFAULT") _defaultRunType = "";
				setActiveSelection(_defaultRunType);

				window.onresize = redrawRunDbViewer;

				_runInfoPluginName = DesktopContent.getDesktopWindowParameter(0,"runInfoPluginName");
				_runInfoPluginUID = DesktopContent.getDesktopWindowParameter(0,"runInfoPluginUID");

				//Retrive run type list from database:
				DesktopContent.XMLHttpRequest("Request?RequestType=GetRunTypeList", //update category list
						"", handleRunTypeListRequest, _runTypeArray);

				makeRunTypeSelect();
				redrawRunDbViewer();
			} //end init()

			//=====================================================================================
			//makeRunTypeSelect ~
			function makeRunTypeSelect()
			{
				// 1. Create label
				const label = document.createElement("label");
				label.setAttribute("for", "runType");
				label.textContent = "Run type:";

				// 2. Create input with datalist
				const input = document.createElement("input");
				input.setAttribute("list", "runTypes");
				input.setAttribute("id", "runType");
				input.setAttribute("name", "runType");
				input.value = _defaultRunType || "All";

				// 3. Create datalist
				const datalist = document.createElement("datalist");
				datalist.id = "runTypes";

				const runTypes = [
					  "All"
					, "production"
					, "calo"
					, "tracker"
					, "crv"
					, "VST"
					, "tracker VST"
					, "calorimeter VST"
					, "crv VST"
					, "stm VST"
					, "EXT VST"
					, "DAQ debugging"
					, "tracker & calorimeter VST"
					, "tracker & crv VST"
					, "calo VST"
					, "tracker VST"
					, "crv VST"];

				runTypes.forEach(type => {
					const option = document.createElement("option");
					option.value = type;
					datalist.appendChild(option);
				});

				// 4. Event listeners
				input.addEventListener("change", () => {
					const value = input.value.trim();
					if (runTypes.includes(value)) {
						Debug.log("Selected:", value);
						performRunTypeSelection(value);
					}
				});

				input.addEventListener("keydown", (event) => {
				if (event.key === "Enter") {
					const value = input.value.trim();
					if (value !== "") {
						Debug.log("ENTER pressed on:", value);
						performRunTypeSelection(value);
					}
					else {
						Debug.log("ENTER pressed on empty: run type has default value");
						performRunTypeSelection(_defaultRunType);
					}
				}
				});

				// 5. Append everything to the page
				const container = document.getElementById("runTypeFilterArea");
				container.appendChild(label);
				container.appendChild(input);
				container.appendChild(datalist);
			} //end makeRunTypeSelect()

			//=====================================================================================
			//performRunTypeSelection ~
			function performRunTypeSelection(runType) {
				if(runType == "All" || runType == "*") runType = "";
				console.log("Action triggered for run type: " + runType);
				setActiveSelection(runType);
				refreshRunDbViewer(); //and refresh now!
			} //end performRunTypeSelection()

			//=====================================================================================
			//setActiveSelection ~
			function setActiveSelection(runType)
			{
				Debug.log("RunDbViewer setActiveSelection to " + runType);

				_activeRunType = runType;

				var str = "";
				str += "<center>";
				str += "<div id='runTypeHeaderLabel'>";
				if(!_activeRunType || _activeRunType == "")
				{	_activeRunType = ""; str += "Showing all run types"; 	}
				else
					str += "<font color='white'>Active run type filter is </font><font style='color:orange'>" + _activeRunType + "</font>";
				str += "</div>";
				str += "</center>";

				currentSelectionHeader.innerHTML = str;
			} //end setActiveSelection()

			//=====================================================================================
			//redrawRunDbViewer ~
			function redrawRunDbViewer()
			{
				Debug.log("RunDbViewer redrawRunDbViewer to  " + window.innerWidth + " - " + window.innerHeight);

				var w = DesktopContent.getWindowWidth();
				if(w < 600) w = 600; //prevent super squeeze

				//keep the page scrollable out to the right margin when the window is narrower than the areas
				document.documentElement.style.minWidth = w + "px";

				for(var i=0;i<_AREAS.length;++i)
				{
					_areaEls[i].style.display = "block";

					_areaEls[i].style.left = _MARGIN + "px";
					_areaEls[i].style.width = (w - _MARGIN*2) + "px";
				}

				//entry bodies carry a fixed pixel width set when toggled; refresh them to the new header width
				var entryBodyWidth = Math.max(500, currentSelectionHeader.offsetWidth - 130);
				var entryBodies = document.getElementsByClassName("RunDbViewer-entryBody");
				for(var i=0;i<entryBodies.length;++i)
					entryBodies[i].style.width = entryBodyWidth + "px";
			} //end redrawRunDbViewer()

			//=====================================================================================
			//convertForClient ~
			//	replace server reserved characters with html equivalents
			//	reserved: ", ', &, <, >, newline, double-space
			function convertForClient(entry)
			{
				//replace special HTML chars-----------
				return entry
					 .replace(/%26/g, "&amp;")  			//&
					 .replace(/%3C/g, "&lt;") 				//<
					 .replace(/%3E/g, "&gt;")				//>
					 .replace(/%22/g, "&quot;")				//"
					 .replace(/%27/g, "&#039;")				//'
					 .replace(/\t/g, "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;")//tab
					 .replace(/%0A%0D/g, "<br>")			//newline
					 .replace(/&#010;/g, "<br>")			//newline
					 .replace(/\n/g, 	 "<br>")			//newline
					 .replace(/%20%20/g, "&nbsp;&nbsp;");	//space
			} //end convertForClient()

			//=====================================================================================
			//handleRunTypeListRequest ~~
			function handleRunTypeListRequest(req, preselectsArr)
			{
				_runTypeArray = req.responseXML.getElementsByTagName(_XML_RUNTYPE_LIST);

				redrawRunDbViewer(); //setup window divs based on admin
				refreshRunDbViewer(); //refresh rundbviewer, by default start with today for one day
			} //end handleRunTypeListRequest()

			//=====================================================================================
			//toggleAutoRefresh ~~
			var _autoRefreshTimer = 0;
			function toggleAutoRefresh()
			{
				Debug.log("RunDbViewer toggleAutoRefresh()");
				if(_autoRefreshTimer) window.clearTimeout(_autoRefreshTimer);
				_autoRefreshTimer = 0;

				if(autoRefreshLink.innerText.indexOf("off") > 0)
				{ //then turn on
					autoRefreshLink.innerText = "Auto-refresh is on";

					_autoRefreshTimer = window.setTimeout(refreshRunDbViewer, 30 * 1000 /* 30 seconds */);
					refreshRunDbViewer(); //and refresh now!
				}
				else //turn off
				{
					autoRefreshLink.innerText = "Auto-refresh is off";
				}

			} //end toggleAutoRefresh()

			//=====================================================================================
			//refreshRunDbViewer ~~
			//	generates request for rundbviewer based on dayIndex and duration
			//		dayIndex = 0 for today, 1 for yesterday, etc
			//		duration is number of days in past to request
			//		if either is undefined, last request value is used
			//	request is looking for time_t seconds
			var _delayRunDbViewerRequestTimer = 0;
			function refreshRunDbViewer(dayIndex,duration)
			{
				Debug.log("RunDbViewer refreshRunDbViewer " + dayIndex + " - " + duration);

				if(typeof dayIndex != "undefined")
					_refreshDayIndex = dayIndex; //get day index integer
				if(typeof duration != "undefined")
					_refreshDuration = duration;
				Debug.log("RunDbViewer refreshRunDbViewer " + _refreshDayIndex + " - " + _refreshDuration);
				var reqDate = (((((new Date()).getTime())/(1000*60*60*24)) | 0) - _refreshDayIndex)*24*60*60;
				if(_mostRecentDayIndex < 0) //most recent day request
					reqDate = 0; //to indicate get most recent day

				Debug.logv({_activeRunType});

				//always show date
				refreshDateDisplay();

				Debug.log("RunDbViewer refreshRunDbViewer start timer");
				if(_delayRunDbViewerRequestTimer) window.clearTimeout(_delayRunDbViewerRequestTimer);
				_delayRunDbViewerRequestTimer = window.setTimeout(function()
					{
						if(_delayRunDbViewerRequestTimer) window.clearTimeout(_delayRunDbViewerRequestTimer);
						_delayRunDbViewerRequestTimer = 0;

						DesktopContent.XMLHttpRequest("Request?RequestType=RefreshRunDbViewer", 		//update category list
								"Date=" + reqDate +
								"&Duration=" + _refreshDuration +
								"&runInfoPluginName=" + _runInfoPluginName +
								"&runInfoPluginUID=" + _runInfoPluginUID +
								"&runTypeFilter=" + encodeURIComponent(_activeRunType),  //* for all, if "" go with active run type
								handleRefreshRunDbViewer);

					}, 500 /* ms */ ); //end delay handler

			} //end refreshRunDbViewer()

			//=====================================================================================
			//handleRefreshRunDbViewer ~~
			//	receives entries newest to oldest and displays them in that order
			function handleRefreshRunDbViewer(req)
			{
				Debug.log("RunDbViewer handleRefreshRunDbViewer", req.responseText.length);

				if(_autoRefreshTimer)  //reset interval, in case of long response times
				{
					window.clearTimeout(_autoRefreshTimer);
					_autoRefreshTimer = window.setTimeout(refreshRunDbViewer, 30 * 1000 /* 30 seconds */);
				}

				var rundbviewerStatus;
				if((rundbviewerStatus = DesktopContent.getXMLValue(req,_XML_STATUS)) !="1") //failed
					document.getElementById("rundbviewerDiv").innerHTML = "<div style='color:rgb(255,183,74)'>" + rundbviewerStatus + "</div>";
				else
				{
					var mostRecentDayStr = DesktopContent.getXMLValue(req,_XML_MOST_RECENT_DAY);
					Debug.log("RunDbViewer handleRefreshRunDbViewer " + mostRecentDayStr);
					if(_mostRecentDayIndex < 0) //never set, so set refresh day to returned most recent day
						_refreshDayIndex = parseInt(mostRecentDayStr);
					_mostRecentDayIndex = parseInt(mostRecentDayStr);
					var mostRecentDayEl = document.getElementById("rundbviewerHeader").getElementsByTagName("a")[0];
					if(_mostRecentDayIndex == 0)
						mostRecentDayEl.innerHTML = "Today";
					else if(_mostRecentDayIndex == 1)
						mostRecentDayEl.innerHTML = "Yesterday";
					else
						mostRecentDayEl.innerHTML = "Most Recent Day";

					refreshDateDisplay();

					//store all entries for client-side filtering
					_allEntries = Array.from(req.responseXML.getElementsByTagName(_XML_RUNDBVIEWER_ENTRY));

					//collect unique run_status values for the filter dropdown
					var statusSet = {};
					for(var i=0;i<_allEntries.length;++i)
					{
						var statusNode = _allEntries[i].getElementsByTagName(_XML_RUNDBVIEWER_ENTRY_RUN_STATUS)[0];
						if(statusNode) statusSet[statusNode.getAttribute("value")] = true;
					}
					buildStatusFilterDropdown(Object.keys(statusSet).sort());

					applyFilters();
				}

				 //schedule next update
				if(_rundbviewerUpdateTimer)
					clearTimeout(_rundbviewerUpdateTimer);
				//_rundbviewerUpdateTimer = window.setTimeout(refreshRunDbViewer,_REFRESH_INTERVAL);  //NOTE: if want refresh every period, uncomment.
																								//currently user must use manual refresh
				redrawRunDbViewer(); //in case of new scroll bars
			} //end handleRefreshRunDbViewer()

			//=====================================================================================
			//buildStatusFilterDropdown ~~
			//	creates or updates the run status filter dropdown in the Run Filters section
			function buildStatusFilterDropdown(statusValues)
			{
				var container = document.getElementById("statusFilterArea");
				if(!container) return;
				if(_activeStatusFilter && statusValues.indexOf(_activeStatusFilter) == -1)
					_activeStatusFilter = "";
				container.innerHTML = "";

				var statusLabel = document.createElement("label");
				statusLabel.setAttribute("for", "statusFilter");
				statusLabel.textContent = "Run status:";
				container.appendChild(statusLabel);

				var statusSelect = document.createElement("select");
				statusSelect.id = "statusFilter";
				var opt = document.createElement("option");
				opt.value = "";
				opt.textContent = "All (" + _allEntries.length + ")";
				statusSelect.appendChild(opt);
				for(var i=0;i<statusValues.length;++i)
				{
					var count = 0;
					for(var j=0;j<_allEntries.length;++j)
					{
						var el = _allEntries[j].getElementsByTagName(_XML_RUNDBVIEWER_ENTRY_RUN_STATUS)[0];
						if(el && el.getAttribute("value") == statusValues[i]) count++;
					}
					opt = document.createElement("option");
					opt.value = statusValues[i];
					opt.textContent = statusValues[i] + " (" + count + ")";
					if(statusValues[i] == _activeStatusFilter) opt.selected = true;
					statusSelect.appendChild(opt);
				}
				statusSelect.addEventListener("change", function(){
					_activeStatusFilter = this.value;
					applyFilters();
				});
				container.appendChild(statusSelect);
			} //end buildStatusFilterDropdown()

			//=====================================================================================
			//applyFilters ~~
			//	filters _allEntries by _activeStatusFilter, then renders
			function applyFilters()
			{
				var rundbviewerEl = document.getElementById("rundbviewerDiv");
				rundbviewerEl.innerHTML = "";

				var shown = 0;
				//server returns newest first (ORDER BY run_number DESC), so keep that order
				for(var i=0;i<_allEntries.length;++i)
				{
					var entry = _allEntries[i];

					if(_activeStatusFilter)
					{
						var statusNode = entry.getElementsByTagName(_XML_RUNDBVIEWER_ENTRY_RUN_STATUS)[0];
						if(!statusNode || statusNode.getAttribute("value") != _activeStatusFilter) continue;
					}
					displayRunDbViewerEntry(rundbviewerEl, entry);
					shown++;
				}

				//show count
				var countEl = document.getElementById("filterCount");
				if(countEl) countEl.textContent = "Showing " + shown + " of " + _allEntries.length + " runs";

				//add helper to move starting date back
				var tmp = document.createElement("div");
				tmp.setAttribute("id", "clearDiv");
				rundbviewerEl.appendChild(tmp);
				tmp = document.createElement("div");
				tmp.innerText = "Note: If you are expecting more entries for the selected criteria, try moving the selected date back in time.";
				rundbviewerEl.appendChild(tmp);

				redrawRunDbViewer();
			} //end applyFilters()

			//=====================================================================================
			//replaceBrWithSpace ~~
			// Replace all <br> tags with a space
			function replaceBrWithSpace(el)
			{
				el.isBrReplaced = "true";
				el.querySelectorAll('br').forEach(br => {
					const space = document.createTextNode(' ');
					space.isBr = "true"; // Mark it for restoration
					br.replaceWith(space);
				});

				var condensedWidth = Math.max(500, currentSelectionHeader.offsetWidth - 130);
				el.setAttribute("style", "white-space: nowrap; overflow-x: auto; width: " +
					condensedWidth + "px;" +
					"padding-top: 2px; padding-bottom: 10px; color: rgb(216 189 139);");
			} //end replaceBrWithSpace()

			//=====================================================================================
			//restoreBr ~~
			// Restore <br> tags
			function restoreBr(el)
			{
				el.isBrReplaced = undefined;
				el.childNodes.forEach(node => {
					if (node.nodeType === Node.TEXT_NODE && node.data.trim() === '' && node.isBr === "true") {
						const br = document.createElement('br');
						node.replaceWith(br);
					}
				});
				var condensedWidth = Math.max(500, currentSelectionHeader.offsetWidth - 130);
				el.setAttribute("style", "overflow-x: auto; width: " +
					condensedWidth + "px;" +
					"padding-top: 20px; padding-bottom: 20px; color: rgb(252 217 164);");
				el.style.display = "none";
			} //end restoreBr()

			function refreshDateDisplay()
			{
				Debug.log("refreshDateDisplay()",_refreshDayIndex);
				var reqTime = (new Date()).getTime() - _refreshDayIndex*24*60*60*1000; //in ms
				var dateObj = new Date(reqTime);

				var displayDate = (dateObj.getMonth()+1) + "/" + dateObj.getDate() + "/" + dateObj.getFullYear();
				document.getElementById("rundbviewerCalendarDateDisplay").innerHTML =
					"<a href='Javascript:;' onmouseup='refreshRunDbViewer(" + _refreshDayIndex + ");'>(" +

				for(var i=0;i<aArr.length;++i)
					if(i < 1 && (reqTime == 0 || _refreshDayIndex == _mostRecentDayIndex))
						aArr[i].setAttribute("class", "rundbviewerSelection");
					else if(i == 1 && !(reqTime == 0 || _refreshDayIndex == _mostRecentDayIndex))

			//=====================================================================================
			//subsystemGroupsTable ~~
			//	builds an HTML table (one row per subsystem) of the configuration and context
			//	groups recorded for the run, from the <subsystem_config_record> children
			function subsystemGroupsTable(entry)
			{
				var recs = entry.getElementsByTagName(_XML_RUNDBVIEWER_ENTRY_SUBSYSTEM_CONFIG_RECORD);
				if(recs.length == 0) return "<i>(no subsystem records)</i>";

				//each record value is '|'-joined:
				//  subsystem|alias|cfgName|cfgKey|ctxName|ctxKey|bbName|bbKey
				var grp = function(n, k) {
					if(!n && (!k || k == "-1")) return "";
					return convertForClient(n) + " <span style='opacity:0.7'>(" + convertForClient(k) + ")</span>";
				};

				var html = "<div class='subsystemGroupsWrap'><table class='subsystemGroups'>";
				html += "<tr><th>Subsystem</th><th>Config alias</th><th>Configuration group</th><th>Context group</th><th>Backbone group</th></tr>";
				for(var i=0;i<recs.length;++i)
				{
					var f = (recs[i].getAttribute("value") || "").split("|");
					while(f.length < 8) f.push("");
					html += "<tr>"
						+ "<td>" + convertForClient(f[0]) + "</td>"
						+ "<td>" + convertForClient(f[1]) + "</td>"
						+ "<td>" + grp(f[2], f[3]) + "</td>"
						+ "<td>" + grp(f[4], f[5]) + "</td>"
						+ "<td>" + grp(f[6], f[7]) + "</td>"
						+ "</tr>";
				}
				return html + "</table></div>";
			} //end subsystemGroupsTable()

			//=====================================================================================
			//restoreRunConfig ~~
			//	asks the Gateway to create/overwrite the aliases RunRestoreConfig and
			//	RunRestoreContext in every subsystem that took part in the run, pointing at
			//	the Configuration and Context groups recorded for that run.
			function restoreRunConfig(linkElement)
			{
				var groupsCell = linkElement.closest("td.subsystemGroupsCell");
				var runNumber = groupsCell.getAttribute("data-run");
				var resultElement = groupsCell.querySelector(".restoreRunConfigResult");

				var summaryLines = [];
				var groupRows = groupsCell.querySelectorAll("table.subsystemGroups tr");
				for(var rowIndex = 1; rowIndex < groupRows.length; ++rowIndex) //skip header row
				{
					var cells = groupRows[rowIndex].children;
					summaryLines.push("  " + cells[0].innerText + ": " +
						cells[2].innerText + "  /  " + cells[3].innerText);
				}

				var confirmText = "Restore the configuration of run " + runNumber + "?\n\n" +
					"This creates (or overwrites) the group aliases RunRestoreConfig and " +
					"RunRestoreContext in the configuration database of every subsystem below, " +
					"pointing at the Configuration / Context groups that run used:\n\n" +
					summaryLines.join("\n") + "\n\n" +
					"Afterwards choose 'RunRestoreConfig' in the Configure dialog to redo that run's setup.\n" +
					"Each subsystem saves and activates a new Backbone group, so this can take up to a minute.";
				if(!confirm(confirmText)) return;

				resultElement.innerHTML = "<i>Restoring run " + runNumber + " configuration aliases...</i>";
				linkElement.style.pointerEvents = "none";

				DesktopContent.XMLHttpRequest("Request?RequestType=restoreRunConfigAliases",
					"runNumber=" + encodeURIComponent(runNumber) +
					"&runInfoPluginName=" + encodeURIComponent(_runInfoPluginName) +
					"&runInfoPluginUID=" + encodeURIComponent(_runInfoPluginUID),
					function(req, reqParam, errStr) { handleRestoreRunConfig(req, errStr, linkElement, resultElement); },
					0 /*reqParam*/, 0 /*progressHandler*/,
					true /*callHandlerOnErr*/, false /*doNotShowLoadingOverlay*/,
					true /*targetGatewaySupervisor*/);
			} //end restoreRunConfig()

			//=====================================================================================
			//handleRestoreRunConfig ~~
			function handleRestoreRunConfig(req, errStr, linkElement, resultElement)
			{
				linkElement.style.pointerEvents = "";

				var groupsCell = resultElement.closest("td.subsystemGroupsCell");
				var runNumber = groupsCell.getAttribute("data-run");

				//subsystem -> "config group / context group" from the groups table in this entry
				var groupsBySubsystem = {};
				var groupRows = groupsCell.querySelectorAll("table.subsystemGroups tr");
				for(var rowIndex = 1; rowIndex < groupRows.length; ++rowIndex) //skip header row
				{
					var cells = groupRows[rowIndex].children;
					groupsBySubsystem[cells[0].innerText.trim()] =
						"config " + cells[2].innerText.trim() + ", context " + cells[3].innerText.trim();
				}
				var describeSubsystem = function(subsystemName) {
					return "<b>" + subsystemName + "</b>" + (groupsBySubsystem[subsystemName] ? " [" + groupsBySubsystem[subsystemName] + "]" : "");
				};

				//inline under the link: only the subsystems that succeeded;
				//	warnings and errors go to Debug popups instead
				var requestErrors = errStr ? [errStr] : DesktopContent.getXMLRequestErrors(req);
				var doneSubsystems = [];
				var unavailableSubsystems = [];
				var failedSubsystems = requestErrors.slice();
				if(req && req.responseXML)
				{
					var subsystemNodes = req.responseXML.getElementsByTagName("subsystem");
					var resultNodes = req.responseXML.getElementsByTagName("result");
					for(var subsystemIndex = 0; subsystemIndex < subsystemNodes.length; ++subsystemIndex)
					{
						var subsystemName = subsystemNodes[subsystemIndex].getAttribute("value");
						var resultText = resultNodes[subsystemIndex] ? resultNodes[subsystemIndex].getAttribute("value") : "";
						if(resultText.indexOf("Done") == 0)
							doneSubsystems.push(describeSubsystem(subsystemName));
						else if(resultText.indexOf("Warning") == 0)
							unavailableSubsystems.push(describeSubsystem(subsystemName));
						else
							failedSubsystems.push(describeSubsystem(subsystemName) + " - " + resultText.replace(/^Error:\s*/, ""));
					}
				}

				if(doneSubsystems.length)
					resultElement.innerHTML = "<span class='restoreDone'>Aliases set to restore run.</span>";
				else
					resultElement.innerHTML = "";

				if(!doneSubsystems.length && !unavailableSubsystems.length && !failedSubsystems.length)
					failedSubsystems.push("No response from Gateway.");

				var doneSummary = doneSubsystems.length
					? "Aliases RunRestoreConfig / RunRestoreContext were set for " + doneSubsystems.length + " subsystem(s):\n" +
						doneSubsystems.join("\n")
					: "The aliases were not set for any subsystem.";

				if(unavailableSubsystems.length)
					Debug.warn("Run " + runNumber + " config restore: " + doneSummary + "\n\n" +
						"NOT set for " + unavailableSubsystems.length + " subsystem(s) that are not currently available:\n" +
						unavailableSubsystems.join("\n") +
						"\n\nStart the missing subsystems and click 'Restore Run Config' again to set their aliases.");
				if(failedSubsystems.length)
					Debug.err("Run " + runNumber + " config restore: " + doneSummary + "\n\n" +
						"FAILED for " + failedSubsystems.length + " subsystem(s):\n" +
						failedSubsystems.join("\n"));
				if(!unavailableSubsystems.length && !failedSubsystems.length)
					Debug.info("Run " + runNumber + " config restore: " + doneSummary);
			} //end handleRestoreRunConfig()

			//=====================================================================================
			//getRunConditionByID ~~
			//	opens the full per-subsystem condition dump for the run in a new browser tab.
			//	Served as plain HTML by the supervisor (RunConditionReport) because the
			//	blobs are ~1 MB and far too large for the XML response path.
			function getRunConditionByID(e)
			{
				var urn = DesktopContent._localUrnLid?DesktopContent._localUrnLid:DesktopContent._serverUrnLid;
				var url = "/urn:xdaq-application:lid=" + urn +
					"/Request?RequestType=RunConditionReport" +
					"&run=" + encodeURIComponent(e.innerText) +
					"&runInfoPluginName=" + encodeURIComponent(_runInfoPluginName) +
					"&runInfoPluginUID=" + encodeURIComponent(_runInfoPluginUID) +
					"&CookieCode=" + DesktopContent._cookieCodeMailbox;
				window.open(url, '_blank');
			} //end getRunConditionByID()

			//=====================================================================================
			//showCalendar ~~
			//	generates request for rundbviewer based on dayIndex and duration
			function showCalendar(e)
			{
				Debug.log("RunDbViewer calendar xy " + e.pageX + " - " + e.pageY);

				//_refreshDayIndex is days into past, 0 for today
				calendarPopup(e.pageX, e.pageY, calendarHandler, (new Date()).getTime() - _refreshDayIndex * (1000*60*60*24));
			} //end showCalendar()

			//=====================================================================================
			//calendarHandler ~~
			//	parameter is days since Jan 1, 1970
			function calendarHandler(userDate)
			{
				var dateObj = new Date(userDate*1000*60*60*24);
				Debug.log("RunDbViewer calendarHandler userDate " + userDate + " = " +
						dateObj.toDateString());

				//update display with user date
				var refreshDayIndex = ((((new Date()).getTime()  + _TIMEZONE_OFFSET_HOURS*1000*60*60 )
					/ (1000*60*60*24)) | 0)
					- userDate;
				Debug.logv({refreshDayIndex});
				var displayDate = (dateObj.getMonth()+1) + "/" + dateObj.getDate() + "/" + dateObj.getFullYear();

				document.getElementById("rundbviewerCalendarDateDisplay").innerHTML =
					"<a href='Javascript:;' onmouseup='refreshRunDbViewer(" + refreshDayIndex + ");'>(" +
					displayDate + ")</a>";

				//refresh rundbviewer with user date
				refreshRunDbViewer(refreshDayIndex);
			} //end calendarHandler()

			//=====================================================================================
			//advanceByDays ~~
			//	refresh rundbviewer with new day offset and display next to calendar
			//	increasing i is subtracted from _refreshDayIndex to go back in time
			function advanceByDays(i)
			{
				refreshRunDbViewer(_refreshDayIndex - i); //positive is back in time
			} //end advanceByDays()

		</script>

	</head>
